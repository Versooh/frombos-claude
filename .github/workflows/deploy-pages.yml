name: FROMBOS — Validate & Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: frombos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build official champion registry
        run: node scripts/build-champion-registry.mjs
      - name: Build Open Series observed champion registry
        run: node scripts/build-open-series-champions.mjs
      - name: Build Open Series scouting registry
        run: node scripts/build-open-series-scouting.mjs
      - name: Build Open Series match results registry
        run: node scripts/build-open-series-results.mjs
      - name: Localize exact Wild Rift tactical map
        run: |
          mkdir -p assets/img
          curl -L --fail --retry 3 --connect-timeout 10 "https://puu.sh/j5JOG/0f458a62b3.jpg" -o assets/img/wild-rift-map.jpg || rm -f assets/img/wild-rift-map.jpg
      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/data.js
          node --check assets/js/store.js
          node --check assets/js/draft-room.js
          node --check assets/js/structural-intelligence.js
          node --check assets/js/draft-intelligence-ui.js
          node --check assets/js/draft-v13.js
          node --check assets/js/composition-intelligence-ui.js
          node --check assets/js/tactical.js
          node --check assets/js/tactical-ux-v8.js
          node --check assets/js/tactical-v11.js
          node --check assets/js/tactical-v12.js
          node --check assets/js/tactical-share-restore.js
          node --check assets/js/vod-review.js
          node --check assets/js/vod-v14.js
          node --check assets/js/vod-performance-v15.js
          node --check assets/js/champion-intelligence.js
          node --check assets/js/champion-registry.generated.js
          node --check assets/js/champion-visual-upgrade.js
          node --check assets/js/curated-champion-data.js
          node --check assets/js/item-assets.js
          node --check assets/js/build-item-upgrade.js
          node --check assets/js/open-series-champions.generated.js
          node --check assets/js/open-series-observed-ui.js
          node --check assets/js/open-series-scouting.generated.js
          node --check assets/js/scouting-registry-ui.js
          node --check assets/js/open-series-results.generated.js
          node --check assets/js/scouting-results-ui.js
          node --check assets/js/performance-center.js
          node --check assets/js/competitive-intelligence.js
          node --check assets/js/competitive-router.js
          node --check assets/js/meta-intelligence.js
          node --check assets/js/meta-router.js
          node --check assets/js/reports.js
          node --check assets/js/reports-router.js
          node --check assets/js/visual-polish.js
          node --check assets/js/i18n-ptbr.js
      - name: Validate integration assets
        run: |
          test -f assets/css/visual-v10.css
          test -f assets/js/i18n-ptbr.js
          test -f assets/css/tactical-v11.css
          test -f assets/js/tactical-v11.js
          test -f assets/css/tactical-v12.css
          test -f assets/js/tactical-v12.js
          test -f assets/css/draft-v13.css
          test -f assets/js/draft-v13.js
          test -f assets/css/vod-review.css
          test -f assets/js/vod-review.js
          test -f assets/js/vod-v14.js
          test -f assets/css/performance-v15.css
          test -f assets/js/vod-performance-v15.js
          grep -q 'visual-v10.css' index.html
          grep -q 'i18n-ptbr.js' index.html
          grep -q 'tactical-v11.css' index.html
          grep -q 'tactical-v11.js' index.html
          grep -q 'tactical-v12.css' index.html
          grep -q 'tactical-v12.js' index.html
          grep -q 'draft-v13.css' index.html
          grep -q 'draft-v13.js' index.html
          grep -q 'draft-v13.css' sw.js
          grep -q 'draft-v13.js' sw.js
          grep -q 'fearlessMode' assets/js/draft-room.js
          grep -q 'VOD REVIEW V14' assets/js/vod-review.js
          grep -q 'vod-v14.js' index.html
          grep -q 'vod-v14.js' sw.js
          grep -q 'vod-review.css?v=14' index.html
          grep -q 'activeSessionId' assets/js/store.js
          grep -q 'captureSnapshot' assets/js/vod-review.js
          grep -q 'vod-session-strip' assets/css/vod-review.css
          grep -q 'performance-v15.css' index.html
          grep -q 'performance-v15.css' sw.js
          grep -q 'vod-performance-v15.js' index.html
          grep -q 'vod-performance-v15.js' sw.js
          grep -q 'VOD_CORRECTION_DRILL' assets/js/performance-center.js
          grep -q 'data-vod-to-training' assets/js/vod-performance-v15.js
          grep -q 'lang="pt-BR"' index.html
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build production registries
        run: |
          node scripts/build-champion-registry.mjs
          node scripts/build-open-series-champions.mjs
          node scripts/build-open-series-scouting.mjs
          node scripts/build-open-series-results.mjs
      - name: Localize exact Wild Rift tactical map
        run: |
          mkdir -p assets/img
          curl -L --fail --retry 3 --connect-timeout 10 "https://puu.sh/j5JOG/0f458a62b3.jpg" -o assets/img/wild-rift-map.jpg || rm -f assets/img/wild-rift-map.jpg
      - name: Prepare public artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
