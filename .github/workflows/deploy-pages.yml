name: Deploy FROMBOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build official champion registry
        run: node scripts/build-champion-registry.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/data.js
          node --check assets/js/store.js
          node --check assets/js/draft-room.js
          node --check assets/js/tactical.js
          node --check assets/js/vod-review.js
          node --check assets/js/champion-intelligence.js
          node --check assets/js/champion-registry.generated.js
      - name: Prepare public artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
