name: Verify FROMBOS V20

on:
  push:
    branches: [rebuild/frombos-v20]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build official Wild Rift champion registry
        run: node scripts/build-champion-registry.mjs

      - name: Validate champion coverage
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const {CHAMPION_REGISTRY,CHAMPION_REGISTRY_META}=await import('./assets/js/champion-registry.generated.js');
          const entries=Object.values(CHAMPION_REGISTRY);
          const resolved=entries.filter(x=>x.portrait).length;
          if(entries.length<135) throw new Error(`registry too small: ${entries.length}`);
          if(resolved<135) throw new Error(`portrait coverage too low: ${resolved}`);
          if(entries.some(x=>x.source!=='RIOT_OFFICIAL')) throw new Error('non-Riot asset source in official registry');
          console.log(`Wild Rift portrait coverage ${resolved}/${entries.length}`,CHAMPION_REGISTRY_META.validation);
          NODE

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: V20 portrait ownership
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'champion-visual-upgrade.js?v=20' index.html
          grep -q 'champion-visual-upgrade.css?v=20' index.html
          ! grep -q 'assets/js/visual-polish.js' index.html
          ! grep -q "'./assets/js/visual-polish.js'" sw.js
          grep -q 'comp-v20-portrait comp-v19-portrait-wrap' assets/js/champion-visual-upgrade.js
          grep -q 'exactly one direct portrait per slot\|one canonical node' assets/js/champion-visual-upgrade.js

      - name: V20 pro module layout ownership
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/css/visual-v20-pro.css
          test -f assets/js/layout-v20.js
          grep -q 'visual-v20-pro.css?v=20.2' index.html
          grep -q 'layout-v20.js?v=20.2' index.html
          grep -q "'./assets/css/visual-v20-pro.css'" sw.js
          grep -q "'./assets/js/layout-v20.js'" sw.js
          grep -q "dataset.page=page" assets/js/layout-v20.js
          grep -q 'composition-card' assets/js/layout-v20.js
          grep -q 'PLANO DE JOGO' assets/js/layout-v20.js
          grep -q 'CONDIÇÃO DE VITÓRIA' assets/js/layout-v20.js
          grep -q 'data-page="comps"' assets/css/visual-v20-pro.css
          grep -q 'data-page="champions"' assets/css/visual-v20-pro.css
          grep -q 'data-page="draft"' assets/css/visual-v20-pro.css

      - name: V20 analysis workspace layout
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/css/visual-v20-analysis.css
          grep -q 'visual-v20-analysis.css?v=20.3' index.html
          grep -q "'./assets/css/visual-v20-analysis.css'" sw.js
          grep -q 'data-page="tactical"' assets/css/visual-v20-analysis.css
          grep -q 'data-page="vod"' assets/css/visual-v20-analysis.css
          grep -q 'tb-viewport' assets/css/visual-v20-analysis.css
          grep -q 'vod-player-stage' assets/css/visual-v20-analysis.css
          grep -q 'vod-timeline' assets/css/visual-v20-analysis.css

      - name: V20 decision controls
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/css/lab-controls-v20.css
          test -f assets/js/lab-controls-v20.js
          grep -q 'lab-controls-v20.css?v=20.4' index.html
          grep -q 'lab-controls-v20.js?v=20.4' index.html
          grep -q "'./assets/css/lab-controls-v20.css'" sw.js
          grep -q "'./assets/js/lab-controls-v20.js'" sw.js
          grep -q 'comp-toolbar-v20' assets/js/lab-controls-v20.js
          grep -q 'data-draft-filter' assets/js/lab-controls-v20.js
          grep -q 'applyCompositionFilters' assets/js/lab-controls-v20.js
          grep -q 'applyDraftFilters' assets/js/lab-controls-v20.js
          grep -q 'draft-filterbar-v20' assets/css/lab-controls-v20.css
          grep -q 'ci-card.is-selected' assets/css/lab-controls-v20.css

      - name: V20 operations workspace
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/css/visual-v20-ops.css
          grep -q 'visual-v20-ops.css?v=20.5' index.html
          grep -q "'./assets/css/visual-v20-ops.css'" sw.js
          grep -q 'data-page="training"' assets/css/visual-v20-ops.css
          grep -q 'data-page="scouting"' assets/css/visual-v20-ops.css
          grep -q 'data-page="reports"' assets/css/visual-v20-ops.css
          grep -q 'match-center-v18' assets/css/visual-v20-ops.css
          grep -q 'performance-vod-bridge' assets/css/visual-v20-ops.css
          grep -q 'scout-command' assets/css/visual-v20-ops.css
          grep -q 'report-metrics' assets/css/visual-v20-ops.css
          grep -q 'mc-filters' assets/css/visual-v20-ops.css

      - name: Wild Rift only guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'ddragon\.leagueoflegends\.com|lol-game-data|CommunityDragon' assets/js/champion-intelligence.js assets/js/champion-visual-upgrade.js scripts/build-champion-registry.mjs
          grep -q 'RIOT_OFFICIAL' scripts/build-champion-registry.mjs
          grep -q 'wildrift.leagueoflegends.com' scripts/build-champion-registry.mjs

      - name: V20 composition duplicate regression guard
        shell: bash
        run: |
          set -euo pipefail
          COUNT=$(grep -o 'src="assets/js/champion-visual-upgrade.js' index.html | wc -l)
          test "$COUNT" -eq 1
          ! grep -q 'src="assets/js/visual-polish.js' index.html
