<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PedidoFlow — Acesso</title>
<style>
:root{--ink:#0b1220;--navy:#101b2d;--blue:#2563eb;--cyan:#22d3ee;--indigo:#4f46e5;--muted:#718096;--line:#dbe4ef}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:#edf3f9;overflow:hidden}
.page{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(440px,.92fr)}
.visual{position:relative;overflow:hidden;padding:56px;display:flex;flex-direction:column;justify-content:space-between;color:white;background:
radial-gradient(circle at 22% 16%,rgba(34,211,238,.17),transparent 27%),
radial-gradient(circle at 82% 82%,rgba(79,70,229,.22),transparent 30%),
linear-gradient(145deg,#08111f,#101d32 58%,#102f43)}
.visual:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 88%)}
.orbit{position:absolute;width:560px;height:560px;border:1px solid rgba(34,211,238,.11);border-radius:50%;right:-260px;top:-240px;box-shadow:0 0 0 54px rgba(37,99,235,.035),0 0 0 108px rgba(34,211,238,.022);animation:float 8s ease-in-out infinite}
.orbit:after{content:"";position:absolute;width:14px;height:14px;border-radius:5px;left:83px;bottom:87px;background:linear-gradient(135deg,var(--cyan),var(--blue));box-shadow:0 0 25px rgba(34,211,238,.75);transform:rotate(45deg)}
@keyframes float{50%{transform:translate(-12px,15px) rotate(6deg)}}
.logo{position:relative;z-index:1;font-size:22px;font-weight:900;letter-spacing:-.045em}.logo:before{content:"";display:inline-block;width:13px;height:13px;border-radius:4px;background:linear-gradient(135deg,var(--cyan),var(--blue));transform:rotate(45deg);margin-right:11px;box-shadow:0 0 20px rgba(34,211,238,.6)}.logo b{color:var(--cyan)}
.copy{position:relative;z-index:1;max-width:620px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;color:#7dd3fc;font-weight:850;font-size:11px}.copy h1{font-size:clamp(38px,5vw,68px);line-height:.98;letter-spacing:-.055em;margin:14px 0 18px}.copy p{max-width:520px;color:#bfcee1;font-size:16px}.flow{display:flex;gap:8px;margin-top:26px;align-items:center}.node{height:7px;border-radius:999px;background:#29405e}.node:nth-child(1){width:48px;background:linear-gradient(90deg,var(--blue),var(--cyan))}.node:nth-child(2){width:90px}.node:nth-child(3){width:34px}
.foot{position:relative;z-index:1;color:#8396ae;font-size:12px}
.auth{display:grid;place-items:center;padding:28px;background:
radial-gradient(circle at 100% 0%,rgba(34,211,238,.07),transparent 30%),
linear-gradient(180deg,#f8fbff,#eef4fa)}
.box{width:min(465px,100%);background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border:1px solid rgba(203,213,225,.82);border-radius:22px;padding:30px;box-shadow:0 30px 90px rgba(31,50,81,.12);animation:enter .38s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.boxmark{width:46px;height:6px;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 20px rgba(34,211,238,.25);margin-bottom:22px}
h2{font-size:28px;letter-spacing:-.04em;margin:0 0 6px}.sub{color:var(--muted);margin-bottom:22px}
.stack{display:grid;gap:10px}label{display:grid;gap:5px;font-size:12px;font-weight:800;color:#44536a}
input{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px 13px;outline:0;background:#fff;color:var(--ink);transition:.17s}
input:focus{border-color:#7ca8f9;box-shadow:0 0 0 4px rgba(37,99,235,.09);transform:translateY(-1px)}
button{border:0;border-radius:11px;padding:12px 14px;font-weight:850;cursor:pointer;background:linear-gradient(135deg,var(--blue),var(--indigo));color:white;box-shadow:0 10px 24px rgba(37,99,235,.18);transition:.18s;margin-top:3px}
button:hover{transform:translateY(-1px);box-shadow:0 14px 28px rgba(37,99,235,.24)}
.note{margin-top:18px;padding:10px 12px;border-radius:10px;background:#f8fafc;border:1px solid #e7edf4;color:#67758a;font-size:12px}
.rolehint{display:flex;gap:7px;align-items:center}.rolehint span{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,80px);opacity:0;background:linear-gradient(135deg,#0f172a,#172554);color:#fff;padding:11px 15px;border-radius:10px;z-index:40;transition:.25s;box-shadow:0 14px 36px #0003}#toast.on{transform:translate(-50%,0);opacity:1}
@media(max-width:900px){body{overflow:auto}.page{grid-template-columns:1fr}.visual{min-height:330px;padding:30px}.copy h1{font-size:42px}.auth{padding:18px;min-height:540px}.orbit{width:400px;height:400px}}
</style>
</head>
<body>
<div class="page">
<section class="visual">
  <div class="orbit"></div>
  <div class="logo">Pedido<b>Flow</b></div>
  <div class="copy">
    <div class="eyebrow">Fluxo de compras em movimento</div>
    <h1>Seu fluxo de compras,<br>em um só lugar.</h1>
    <p>Acompanhe pedidos, atualizações e tarefas com um acesso simples, rápido e centralizado.</p>
    <div class="flow"><div class="node"></div><div class="node"></div><div class="node"></div></div>
  </div>
  <div class="foot">EMPAT · acompanhamento e coleta operacional de pedidos</div>
</section>
<section class="auth">
  <div class="box" id="box"></div>
</section>
</div>
<div id="toast"></div>
<script>
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('on');clearTimeout(window._t);window._t=setTimeout(function(){e.classList.remove('on')},2800)}
async function req(url,opt){opt=opt||{};var r=await fetch(url,Object.assign({credentials:'include',headers:{'Content-Type':'application/json'}},opt));if(!r.ok){var msg='Erro na solicitação';try{var j=await r.json();msg=j.detail||msg}catch(e){}throw new Error(msg)}return r}
async function boot(){
  var b=await (await fetch('/api/bootstrap',{credentials:'include'})).json();
  if(b.user)return route(b.user.role);
  login();
}
function route(role){location.href=role==='admin'?'/admin':'/painel'}
function login(){
  box.innerHTML='<div class="boxmark"></div><h2>Entrar no PedidoFlow</h2><div class="sub">Informe seu usuário e sua senha para acessar o sistema.</div><div class="stack"><label>Usuário<input id="username" autocomplete="username" placeholder="Seu usuário"></label><label>Senha<input id="password" type="password" autocomplete="current-password" placeholder="Sua senha"></label><button id="go">Entrar</button></div><div class="note">Acesso interno ao PedidoFlow.</div>';
  document.getElementById('go').onclick=doLogin;
  ['username','password'].forEach(function(id){document.getElementById(id).addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();doLogin()}})})
}
async function doLogin(){
  var payload={username:document.getElementById('username').value.trim(),password:document.getElementById('password').value};
  if(!payload.username||!payload.password)return toast('Informe usuário e senha');
  try{var r=await req('/api/login',{method:'POST',body:JSON.stringify(payload)});var j=await r.json();route(j.role)}
  catch(e){toast(e.message)}
}
boot();
</script>
</body></html>
