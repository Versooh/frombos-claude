<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PedidoFlow — Portal do Comprador</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--text:#162238;--muted:#6a7890;--line:#dfe6ef;--blue:#2563eb;--blue2:#dbeafe;--green:#15803d;--green2:#dcfce7;--amber:#b45309;--amber2:#fef3c7;--red:#b91c1c;--red2:#fee2e2;--shadow:0 15px 40px rgba(15,34,58,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}.hidden{display:none!important}
header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;position:sticky;top:0;z-index:5}.brand{font-size:18px;font-weight:850}.brand b{color:var(--blue)}.live{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;background:#22c55e;border-radius:50%;box-shadow:0 0 0 5px #22c55e18;animation:pulse 1.5s infinite}@keyframes pulse{50%{opacity:.35;box-shadow:0 0 0 10px #22c55e06}}.user{margin-left:15px;font-weight:700}
main{max-width:1180px;margin:auto;padding:18px}.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:13px}.hello h1{font-size:24px;margin:0}.hello p{margin:4px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:13px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;box-shadow:0 2px 10px #1e293b08;animation:rise .35s both;cursor:pointer}.stat:nth-child(2){animation-delay:.05s}.stat:nth-child(3){animation-delay:.1s}.stat:hover{border-color:#b6cdf6;transform:translateY(-1px)}.stat small{color:var(--muted);font-weight:700}.stat strong{display:block;font-size:27px;margin-top:3px}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.bar input{flex:1;min-width:220px}.tabs{display:flex;gap:5px;background:#eef2f7;padding:3px;border-radius:9px}.tabs button{border:0;background:transparent;color:#66758b;border-radius:7px;padding:7px 10px;font-weight:750;cursor:pointer}.tabs button.on{background:#fff;color:#1d4ed8;box-shadow:0 2px 8px #1e293b0d}
input,select,textarea{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:9px 10px;outline:none}.search:focus,input:focus,select:focus,textarea:focus{border-color:#7aa6f7;box-shadow:0 0 0 3px #2563eb12}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);cursor:pointer;transition:.17s;animation:rise .25s both}.card:hover{transform:translateY(-2px);border-color:#b9cdf1}.card.new{box-shadow:inset 3px 0 0 #2563eb,var(--shadow)}.topline{display:flex;gap:8px;align-items:center}.ord{font-size:17px;font-weight:850}.supplier{font-weight:700;margin-top:5px}.items{margin-top:9px}.itemline{padding:7px 0;border-top:1px solid #edf1f6;color:#334155}.itemline:first-child{border-top:0}.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:9px}.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800}.novo{background:var(--blue2);color:#1d4ed8}.pendente{background:var(--amber2);color:var(--amber)}.preenchido{background:var(--green2);color:var(--green)}.tag{background:#eef2f7;color:#526178}.muted{color:var(--muted);font-size:12px}.empty{text-align:center;color:var(--muted);padding:45px;background:#fff;border:1px dashed #cad4e0;border-radius:14px}
.overlay{position:fixed;inset:0;background:#0f172a66;z-index:20;opacity:0;pointer-events:none;transition:.2s}.overlay.on{opacity:1;pointer-events:auto}.drawer{position:fixed;inset:0 0 0 auto;width:min(560px,100%);background:#fff;z-index:21;transform:translateX(103%);transition:.25s cubic-bezier(.2,.8,.2,1);box-shadow:-24px 0 60px #0f172a25;overflow:auto}.drawer.on{transform:none}.head{padding:17px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fffffff5;backdrop-filter:blur(8px);z-index:2}.head h2{margin:4px 0}.x{float:right;width:32px;height:32px;border:0;border-radius:8px;background:#eef2f7;cursor:pointer}.body{padding:16px}.section{margin:18px 0 7px;color:#7a889b;text-transform:uppercase;font-size:11px;font-weight:850;letter-spacing:.06em}.ibox{border:1px solid var(--line);border-radius:10px;padding:10px;margin:7px 0}.ibox b{display:block}.form{display:grid;gap:10px}.form label{display:grid;gap:4px;font-size:12px;font-weight:750}.delivery{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;text-align:center;font-weight:800;cursor:pointer}.choice.on{border-color:#6ea0f6;background:#eff6ff;color:#1d4ed8;box-shadow:0 0 0 3px #2563eb10}.prior{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.prior button{border:1px solid var(--line);background:#fff;padding:8px 4px;border-radius:9px;cursor:pointer}.prior button.on{background:#172033;color:#fff;border-color:#172033}.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.btn:hover{filter:brightness(.97)}.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,80px);opacity:0;background:#172033;color:#fff;padding:11px 15px;border-radius:10px;z-index:40;transition:.25s;box-shadow:0 14px 36px #0003}#toast.on{transform:translate(-50%,0);opacity:1}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(470px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow);animation:rise .35s}.authbox h1{margin:0}.authbox p{color:var(--muted)}.authbox .stack{display:grid;gap:9px;margin-top:17px}.authbox input{width:100%}
@media(max-width:760px){main{padding:12px}.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.hello{align-items:flex-start;flex-direction:column}.bar{align-items:stretch}.tabs{overflow:auto}.prior{grid-template-columns:repeat(2,1fr)}}
</style>
<style>
:root{--flow-cyan:#22d3ee;--flow-blue:#2563eb;--flow-indigo:#4f46e5;--flow-ink:#0b1220}
body{
  background:
    radial-gradient(circle at 5% 0%,rgba(37,99,235,.08),transparent 28%),
    radial-gradient(circle at 95% 4%,rgba(34,211,238,.07),transparent 24%),
    linear-gradient(180deg,#f6f9fd,#edf3f9);
}
header{
  background:rgba(255,255,255,.93);backdrop-filter:blur(12px);
  box-shadow:0 8px 30px rgba(15,23,42,.035)
}
.brand{letter-spacing:-.035em}
.brand:before{
  content:"";display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:9px;
  background:linear-gradient(135deg,var(--flow-cyan),var(--flow-blue));
  box-shadow:0 0 18px rgba(34,211,238,.5);transform:rotate(45deg)
}
.brand b{background:linear-gradient(90deg,var(--flow-blue),var(--flow-cyan));-webkit-background-clip:text;color:transparent}
.live{background:#f1f5f9;border:1px solid #e2e8f0;padding:5px 9px;border-radius:999px}
.hello{
  background:linear-gradient(110deg,#0f1b2e,#172554 62%,#12344b);
  color:#fff;padding:18px 20px;border-radius:16px;position:relative;overflow:hidden;
  box-shadow:0 18px 45px rgba(30,64,175,.15)
}
.hello:after{
  content:"";position:absolute;width:260px;height:260px;border-radius:50%;
  border:1px solid rgba(34,211,238,.14);right:-120px;top:-160px;
  box-shadow:0 0 0 32px rgba(37,99,235,.06),0 0 0 64px rgba(34,211,238,.025)
}
.hello p{color:#c6d4e7!important}.hello .btn{position:relative;z-index:1}
.stats{margin-top:13px}
.stat{
  position:relative;overflow:hidden;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease
}
.stat:after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,var(--flow-blue),var(--flow-cyan));opacity:.55
}
.stat:hover{box-shadow:0 14px 30px rgba(37,99,235,.08)}
.bar{box-shadow:0 8px 24px rgba(15,23,42,.04)}
.tabs button{transition:.18s ease}.tabs button:hover{color:#1d4ed8}
.card{
  position:relative;overflow:hidden;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease
}
.card:hover{box-shadow:0 20px 44px rgba(37,99,235,.09)}
.card.new:before{
  content:"NOVO";position:absolute;right:-29px;top:11px;width:98px;text-align:center;
  transform:rotate(36deg);font-size:9px;font-weight:900;letter-spacing:.11em;color:#1d4ed8;
  background:#dbeafe;padding:3px 0
}
.card.new{animation:newPulse 2.7s ease-in-out infinite}
@keyframes newPulse{0%,100%{box-shadow:inset 3px 0 0 #2563eb,0 12px 32px rgba(15,34,58,.07)}50%{box-shadow:inset 3px 0 0 #22d3ee,0 16px 36px rgba(37,99,235,.11)}}
.drawer{
  background:
    radial-gradient(circle at 100% 0%,rgba(34,211,238,.06),transparent 28%),#fff;
  border-left:1px solid #dce7f3
}
.head:before{
  content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,var(--flow-blue),var(--flow-cyan))
}
.choice,.prior button{transition:transform .15s ease,border-color .15s ease,background .15s ease}
.choice:hover,.prior button:hover{transform:translateY(-1px);border-color:#93b8f7}
.choice.on{
  background:linear-gradient(135deg,#eff6ff,#ecfeff);
  border-color:#67a4f9;box-shadow:0 0 0 3px #2563eb0d
}
.btn{
  background:linear-gradient(135deg,var(--flow-blue),var(--flow-indigo));
  box-shadow:0 8px 18px rgba(37,99,235,.16);transition:.18s ease
}
.btn:hover{box-shadow:0 12px 24px rgba(37,99,235,.24);transform:translateY(-1px)}
.auth{
  background:
    radial-gradient(circle at 13% 18%,rgba(37,99,235,.14),transparent 28%),
    radial-gradient(circle at 87% 18%,rgba(34,211,238,.10),transparent 25%),
    linear-gradient(135deg,#eef4fb,#f9fbfe 60%,#eef7fb);
  position:relative;overflow:hidden
}
.auth:before{
  content:"";position:absolute;width:430px;height:430px;border-radius:50%;
  border:1px solid rgba(37,99,235,.08);right:-220px;top:-180px;
  box-shadow:0 0 0 45px rgba(37,99,235,.025),0 0 0 90px rgba(34,211,238,.018)
}
.authbox{
  position:relative;z-index:1;background:rgba(255,255,255,.94);backdrop-filter:blur(15px);
  box-shadow:0 30px 90px rgba(27,48,83,.12);padding:28px
}
.authbox:before{
  content:"";display:block;width:44px;height:5px;border-radius:999px;margin-bottom:18px;
  background:linear-gradient(90deg,var(--flow-blue),var(--flow-cyan));
  box-shadow:0 0 18px rgba(34,211,238,.28)
}
#toast{background:linear-gradient(135deg,#0f172a,#172554);border:1px solid rgba(96,165,250,.2)}
</style></head>
<body>
<div id="root"></div>
<div class="overlay" id="ov"></div>
<aside class="drawer" id="drawer"></aside>
<div id="toast"></div>
<script>
var st={user:null,orders:[],tab:'Novo',search:'',event:null,current:null,priority:'Normal',delivery:''};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]})}
function fmtDT(v){if(!v)return '—';var d=new Date(v);return isNaN(d)?'—':d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}
function badge(s){var c=s==='Novo'?'novo':s==='Pendente'?'pendente':'preenchido';return '<span class="badge '+c+'">'+esc(s)+'</span>'}
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('on');clearTimeout(window._t);window._t=setTimeout(function(){e.classList.remove('on')},2600)}
async function req(url,opt){opt=opt||{};var r=await fetch(url,Object.assign({credentials:'include',headers:{'Content-Type':'application/json'}},opt));if(!r.ok)throw new Error(await r.text());return r}
async function boot(){var b=await (await fetch('/api/bootstrap',{credentials:'include'})).json();if(!b.initialized)return document.getElementById('root').innerHTML='<div class="auth"><div class="authbox"><h1>PedidoFlow</h1><p>O administrador ainda precisa configurar o sistema.</p></div></div>';if(!b.user)return renderLogin();st.user=b.user;if(b.user.role==='admin'){location='/';return}renderShell();await refresh();connectEvents()}
function renderLogin(){document.getElementById('root').innerHTML='<div class="auth"><div class="authbox"><h1>PedidoFlow</h1><p>Acesso exclusivo dos compradores</p><div class="stack"><input id="username" autocomplete="username" placeholder="Usuário comprador"><input id="password" type="password" autocomplete="current-password" placeholder="Senha"><button class="btn" id="loginBtn">Entrar como comprador</button></div></div></div>';loginBtn.onclick=login}
async function login(){
  var payload={
    username:document.getElementById('username').value.trim(),
    password:document.getElementById('password').value
  };
  if(!payload.username||!payload.password){return toast('Informe usuário e senha')}
  try{await req('/api/login/buyer',{method:'POST',body:JSON.stringify(payload)});location.reload()}
  catch(e){toast('Usuário ou senha inválidos')}
}
function renderShell(){document.getElementById('root').innerHTML='<header><div class="brand">Pedido<b>Flow</b></div><div class="live"><span class="dot" id="dot"></span><span id="liveText">tempo real</span></div><div class="user">'+esc(st.user.name)+'</div></header><main><div class="hello"><div><h1>Olá, '+esc(st.user.name)+'</h1><p>Confira os pedidos novos e preencha somente o que falta.</p></div><button class="btn ghost" id="logout">Sair</button></div><div id="view"></div></main>';logout.onclick=async function(){await req('/api/logout',{method:'POST'});location.reload()}}
async function refresh(){st.orders=await (await req('/api/orders')).json();render()}
function count(s){return st.orders.filter(function(o){return o.workflow_status===s}).length}
function render(){var f=st.orders.filter(function(o){var text=(o.number+' '+o.supplier.name+' '+o.items.map(function(i){return i.description+' '+i.code}).join(' ')).toLowerCase();return (!st.tab||o.workflow_status===st.tab)&&(!st.search||text.indexOf(st.search)>=0)});var html='<div class="stats"><div class="stat" data-tab="Novo"><small>Novos pedidos</small><strong>'+count('Novo')+'</strong></div><div class="stat" data-tab="Pendente"><small>Pendentes</small><strong>'+count('Pendente')+'</strong></div><div class="stat" data-tab="Preenchido"><small>Preenchidos</small><strong>'+count('Preenchido')+'</strong></div></div>';
html+='<div class="bar"><input class="search" id="search" placeholder="Buscar pedido, fornecedor ou descrição do item…" value="'+esc(st.search)+'"><div class="tabs"><button data-t="Novo" class="'+(st.tab==='Novo'?'on':'')+'">Novos</button><button data-t="Pendente" class="'+(st.tab==='Pendente'?'on':'')+'">Pendentes</button><button data-t="Preenchido" class="'+(st.tab==='Preenchido'?'on':'')+'">Preenchidos</button><button data-t="" class="'+(st.tab===''?'on':'')+'">Todos</button></div></div><div class="grid">';
if(!f.length)html+='<div class="empty" style="grid-column:1/-1">Nenhum pedido nesta lista.</div>';
f.forEach(function(o){var shown=o.items.slice(0,2),more=o.items.length-shown.length;html+='<article class="card '+(o.workflow_status==='Novo'?'new':'')+'" data-n="'+o.number+'"><div class="topline"><div class="ord">Pedido '+esc(o.number)+'</div>'+badge(o.workflow_status)+'</div><div class="supplier">'+esc(o.supplier.name||'Fornecedor não informado')+'</div><div class="items">'+shown.map(function(i){return '<div class="itemline"><b>'+esc(i.description)+'</b><div class="muted">'+i.quantity+' '+esc(i.unit||'')+(i.code?' · cód. '+esc(i.code):'')+'</div></div>'}).join('')+(more>0?'<div class="muted">+'+more+' item(ns) no pedido</div>':'')+'</div><div class="meta">'+(o.delivery_type?'<span class="badge tag">'+esc(o.delivery_type)+'</span>':'')+'<span class="muted">Alteração: '+fmtDT(o.last_modified_at)+'</span></div></article>'});
html+='</div>';view.innerHTML=html;search.oninput=function(){st.search=this.value.toLowerCase();render()};document.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){st.tab=b.dataset.t;render()}});document.querySelectorAll('.stat').forEach(function(c){c.onclick=function(){st.tab=c.dataset.tab;render()}});document.querySelectorAll('.card[data-n]').forEach(function(c){c.onclick=function(){openOrder(c.dataset.n)}})}
async function openOrder(n){var o=await (await req('/api/orders/'+n)).json();st.current=o;st.priority=o.priority||'Normal';st.delivery=o.delivery_type||'';var d=drawer,items=o.items.map(function(i){return '<div class="ibox"><b>'+esc(i.description)+'</b><div class="muted">Código: '+esc(i.code||'—')+' · Quantidade: '+i.quantity+' '+esc(i.unit||'')+' · Entregue: '+i.delivered+'</div></div>'}).join('');
d.innerHTML='<div class="head"><button class="x" id="closeD">×</button>'+badge(o.workflow_status)+'<h2>Pedido '+esc(o.number)+'</h2><div class="muted">'+esc(o.supplier.name)+'</div></div><div class="body"><div class="section">Itens do pedido</div>'+items+'<div class="section">Preenchimento</div><div class="form"><label>Data em que enviou ao fornecedor<input id="sent" type="date" value="'+esc(o.sent_at||'')+'"></label><label>Tipo de entrega<div class="delivery"><button class="choice" data-d="COLETA">Coleta</button><button class="choice" data-d="ENTREGA">Entrega</button></div></label><label>Prioridade<div class="prior"><button data-p="Baixa">Baixa</button><button data-p="Normal">Normal</button><button data-p="Alta">Alta</button><button data-p="Urgente">Urgente</button></div></label><label>Observação<textarea id="obs" rows="4" placeholder="Informação útil para o acompanhamento">'+esc(o.entry_notes||'')+'</textarea></label><button class="btn" id="save">Salvar preenchimento</button></div><div class="section">Registro</div><div class="muted">Comprador: '+esc(o.buyer_name||st.user.name)+'<br>Última alteração: '+fmtDT(o.last_modified_at)+'</div></div>';
d.classList.add('on');ov.classList.add('on');closeD.onclick=closeDrawer;ov.onclick=closeDrawer;paintChoices();document.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){st.delivery=b.dataset.d;paintChoices()}});document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){st.priority=b.dataset.p;paintChoices()}});save.onclick=saveOrder}
function paintChoices(){document.querySelectorAll('[data-d]').forEach(function(b){b.classList.toggle('on',b.dataset.d===st.delivery)});document.querySelectorAll('[data-p]').forEach(function(b){b.classList.toggle('on',b.dataset.p===st.priority)})}
async function saveOrder(){if(!sent.value)return toast('Informe a data de envio ao fornecedor');if(!st.delivery)return toast('Selecione Coleta ou Entrega');try{await req('/api/orders/'+st.current.number+'/buyer-submit',{method:'POST',body:JSON.stringify({sent_at:sent.value,delivery_type:st.delivery,priority:st.priority,entry_notes:obs.value})});toast('Pedido preenchido com sucesso');closeDrawer();await refresh();st.tab='Preenchido';render()}catch(e){toast('Não foi possível salvar')}}
function closeDrawer(){drawer.classList.remove('on');ov.classList.remove('on')}
function connectEvents(){if(st.event)st.event.close();var es=new EventSource('/api/events');st.event=es;es.onopen=function(){liveText.textContent='tempo real';dot.style.background='#22c55e'};es.onmessage=async function(ev){try{var m=JSON.parse(ev.data);if(m.type==='import.completed'){toast((m.payload.created||0)+' novo(s) pedido(s) importado(s)');st.tab='Novo'}else if(m.type==='order.updated')toast('Um pedido foi atualizado');await refresh()}catch(e){}};es.onerror=function(){liveText.textContent='reconectando…';dot.style.background='#f59e0b'}}
setInterval(function(){if(st.user)refresh().catch(function(){})},20000);boot();
</script>
</body></html>
