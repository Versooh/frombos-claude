<style>
:root{--flow-cyan:#22d3ee;--flow-blue:#2563eb;--flow-indigo:#4f46e5;--flow-ink:#0b1220}
body{
  background:
    radial-gradient(circle at 5% 0%,rgba(37,99,235,.08),transparent 28%),
    radial-gradient(circle at 95% 4%,rgba(34,211,238,.07),transparent 24%),
    linear-gradient(180deg,#f6f9fd,#edf3f9);
}
header{
  background:rgba(255,255,255,.93);backdrop-filter:blur(12px);
  box-shadow:0 8px 30px rgba(15,23,42,.035)
}
.brand{letter-spacing:-.035em}
.brand:before{
  content:"";display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:9px;
  background:linear-gradient(135deg,var(--flow-cyan),var(--flow-blue));
  box-shadow:0 0 18px rgba(34,211,238,.5);transform:rotate(45deg)
}
.brand b{background:linear-gradient(90deg,var(--flow-blue),var(--flow-cyan));-webkit-background-clip:text;color:transparent}
.live{background:#f1f5f9;border:1px solid #e2e8f0;padding:5px 9px;border-radius:999px}
.hello{
  background:linear-gradient(110deg,#0f1b2e,#172554 62%,#12344b);
  color:#fff;padding:18px 20px;border-radius:16px;position:relative;overflow:hidden;
  box-shadow:0 18px 45px rgba(30,64,175,.15)
}
.hello:after{
  content:"";position:absolute;width:260px;height:260px;border-radius:50%;
  border:1px solid rgba(34,211,238,.14);right:-120px;top:-160px;
  box-shadow:0 0 0 32px rgba(37,99,235,.06),0 0 0 64px rgba(34,211,238,.025)
}
.hello p{color:#c6d4e7!important}.hello .btn{position:relative;z-index:1}
.stats{margin-top:13px}
.stat{
  position:relative;overflow:hidden;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease
}
.stat:after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,var(--flow-blue),var(--flow-cyan));opacity:.55
}
.stat:hover{box-shadow:0 14px 30px rgba(37,99,235,.08)}
.bar{box-shadow:0 8px 24px rgba(15,23,42,.04)}
.tabs button{transition:.18s ease}.tabs button:hover{color:#1d4ed8}
.card{
  position:relative;overflow:hidden;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease
}
.card:hover{box-shadow:0 20px 44px rgba(37,99,235,.09)}
.card.new:before{
  content:"NOVO";position:absolute;right:-29px;top:11px;width:98px;text-align:center;
  transform:rotate(36deg);font-size:9px;font-weight:900;letter-spacing:.11em;color:#1d4ed8;
  background:#dbeafe;padding:3px 0
}
.card.new{animation:newPulse 2.7s ease-in-out infinite}
@keyframes newPulse{0%,100%{box-shadow:inset 3px 0 0 #2563eb,0 12px 32px rgba(15,34,58,.07)}50%{box-shadow:inset 3px 0 0 #22d3ee,0 16px 36px rgba(37,99,235,.11)}}
.drawer{
  background:
    radial-gradient(circle at 100% 0%,rgba(34,211,238,.06),transparent 28%),#fff;
  border-left:1px solid #dce7f3
}
.head:before{
  content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,var(--flow-blue),var(--flow-cyan))
}
.choice,.prior button{transition:transform .15s ease,border-color .15s ease,background .15s ease}
.choice:hover,.prior button:hover{transform:translateY(-1px);border-color:#93b8f7}
.choice.on{
  background:linear-gradient(135deg,#eff6ff,#ecfeff);
  border-color:#67a4f9;box-shadow:0 0 0 3px #2563eb0d
}
.btn{
  background:linear-gradient(135deg,var(--flow-blue),var(--flow-indigo));
  box-shadow:0 8px 18px rgba(37,99,235,.16);transition:.18s ease
}
.btn:hover{box-shadow:0 12px 24px rgba(37,99,235,.24);transform:translateY(-1px)}
.auth{
  background:
    radial-gradient(circle at 13% 18%,rgba(37,99,235,.14),transparent 28%),
    radial-gradient(circle at 87% 18%,rgba(34,211,238,.10),transparent 25%),
    linear-gradient(135deg,#eef4fb,#f9fbfe 60%,#eef7fb);
  position:relative;overflow:hidden
}
.auth:before{
  content:"";position:absolute;width:430px;height:430px;border-radius:50%;
  border:1px solid rgba(37,99,235,.08);right:-220px;top:-180px;
  box-shadow:0 0 0 45px rgba(37,99,235,.025),0 0 0 90px rgba(34,211,238,.018)
}
.authbox{
  position:relative;z-index:1;background:rgba(255,255,255,.94);backdrop-filter:blur(15px);
  box-shadow:0 30px 90px rgba(27,48,83,.12);padding:28px
}
.authbox:before{
  content:"";display:block;width:44px;height:5px;border-radius:999px;margin-bottom:18px;
  background:linear-gradient(90deg,var(--flow-blue),var(--flow-cyan));
  box-shadow:0 0 18px rgba(34,211,238,.28)
}
#toast{background:linear-gradient(135deg,#0f172a,#172554);border:1px solid rgba(96,165,250,.2)}

0 4px;color:#718096;font-size:9px}.detailForm{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detailForm .wideLabel{grid-column:1/-1}.detailSave{grid-column:1/-1}.auditCard{margin-top:18px;padding:12px;border:1px solid #e1e8f0;border-radius:11px;background:#f8fafc;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.auditCard span,.auditCard b{display:block}.auditCard span{font-size:8px;text-transform:uppercase;letter-spacing:.09em;color:#8795a9}.auditCard b{font-size:10px;margin-top:3px}.chartBody{display:flex;align-items:center;gap:15px}@media(max-width:900px){.ordersGrid{grid-template-columns:1fr}.orderFacts{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.detailSummary,.auditCard,.detailForm{grid-template-columns:1fr}.detailForm .wideLabel,.detailSave{grid-column:auto}}
</style></head>
<body>
<div id="root"></div>
<div class="overlay" id="ov"></div>
<aside class="drawer" id="drawer"></aside>
<div id="toast"></div>
<script>
var st={user:null,orders:[],tab:'Novo',search:'',event:null,current:null,priority:'Normal',delivery:''};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]})}
function fmtDate(v){if(!v)return '—';var d=new Date(v.length===10?v+'T00:00:00':v);return isNaN(d)?'—':d.toLocaleDateString('pt-BR')}
function fmtDT(v){if(!v)return '—';var d=new Date(v);return isNaN(d)?'—':d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}
function badge(s){var c=s==='Novo'?'novo':s==='Pendente'?'pendente':'preenchido';return '<span class="badge '+c+'">'+esc(s)+'</span>'}
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('on');clearTimeout(window._t);window._t=setTimeout(function(){e.classList.remove('on')},2600)}
async function req(url,opt){opt=opt||{};var r=await fetch(url,Object.assign({credentials:'include',headers:{'Content-Type':'application/json'}},opt));if(r.status===401){location='/?updated=1';throw new Error('Sessão encerrada após atualização')}if(!r.ok){var msg='Erro na solicitação';try{var j=await r.json();msg=j.detail||msg}catch(e){try{msg=await r.text()}catch(_){}}throw new Error(msg)}return r}
async function boot(){var b=await (await fetch('/api/bootstrap',{credentials:'include'})).json();if(!b.user){location=b.update_required?'/?updated=1':'/';return}if(b.user.role==='admin'){location='/admin';return}st.user=b.user;renderShell();await refresh();connectEvents()}
function renderLogin(){document.getElementById('root').innerHTML='<div class="auth"><div class="authbox"><h1>PedidoFlow</h1><p>Acesso exclusivo dos compradores</p><div class="stack"><input id="username" autocomplete="username" placeholder="Usuário comprador"><input id="password" type="password" autocomplete="current-password" placeholder="Senha"><button class="btn" id="loginBtn">Entrar como comprador</button></div></div></div>';loginBtn.onclick=login}
async function login(){
  var payload={
    username:document.getElementById('username').value.trim(),
    password:document.getElementById('password').value
  };
  if(!payload.username||!payload.password){return toast('Informe usuário e senha')}
  try{await req('/api/login/buyer',{method:'POST',body:JSON.stringify(payload)});location.reload()}
  catch(e){toast('Usuário ou senha inválidos')}
}
function renderShell(){document.getElementById('root').innerHTML='<header><div class="brand">Pedido<b>Flow</b></div><div class="buyerMode"><span>ÁREA DO COMPRADOR</span></div><div class="live"><span class="dot" id="dot"></span><span id="liveText">sincronizado</span></div><div class="userChip"><div class="miniAvatar">'+esc((st.user.name||'?').charAt(0).toUpperCase())+'</div><div><b>'+esc(st.user.name)+'</b><small>Comprador</small></div></div></header><main><div class="hello"><div><div class="heroMicro">MINHA CARTEIRA</div><h1>Olá, '+esc(st.user.name)+'</h1><p>Priorize os novos pedidos e complete apenas as informações que dependem de você.</p></div><div class="heroActions"><button class="btn ghost" id="changePassBuyer">Alterar senha</button><button class="btn ghost" id="logout">Sair</button></div></div><div id="view"></div></main>';document.getElementById('changePassBuyer').onclick=openPassword;document.getElementById('logout').onclick=async function(){await req('/api/logout',{method:'POST'});location='/'}}
async function refresh(){st.orders=await (await req('/api/orders')).json();render()}
function count(s){return st.orders.filter(function(o){return o.workflow_status===s}).length}
function buyerDashboardHtml(){
  var total=st.orders.length||1,novo=count('Novo'),pend=count('Pendente'),fill=count('Preenchido');
  var p1=Math.round(novo/total*100),p2=Math.round(pend/total*100);
  var donut='conic-gradient(#3b82f6 0 '+p1+'%,#f59e0b '+p1+'% '+(p1+p2)+'%,#22c55e '+(p1+p2)+'% 100%)';
  var priorities=['Urgente','Alta','Normal','Baixa'];
  var pmax=Math.max.apply(null,priorities.map(function(s){return st.orders.filter(function(o){return o.priority===s}).length}).concat([1]));
  return '<section class="buyerDash">'+
    '<div class="buyerChart"><div class="chartTitle"><span>MINHA CARTEIRA</span><h3>Progresso dos pedidos</h3></div><div class="chartBody"><div class="donutSmall" style="background:'+donut+'"><div><b>'+fill+'</b><small>preenchidos</small></div></div><div class="miniLegend"><span><i class="b1"></i>Novos <b>'+novo+'</b></span><span><i class="b2"></i>Pendentes <b>'+pend+'</b></span><span><i class="b3"></i>Preenchidos <b>'+fill+'</b></span></div></div></div>'+
    '<div class="buyerChart"><div class="chartTitle"><span>PRIORIDADE</span><h3>Distribuição da carteira</h3></div><div class="bars">'+priorities.map(function(s){var n=st.orders.filter(function(o){return o.priority===s}).length;return '<div class="barLine"><label><span>'+esc(s)+'</span><b>'+n+'</b></label><div><i data-p="'+s+'" style="width:'+Math.round(n/pmax*100)+'%"></i></div></div>'}).join('')+'</div></div>'+
  '</section>'
}
function filteredBuyerOrders(){
  return st.orders.filter(function(o){
    var text=(o.number+' '+o.supplier.name+' '+o.items.map(function(i){return i.description+' '+i.code}).join(' ')).toLowerCase();
    return (!st.tab||o.workflow_status===st.tab)&&(!st.search||text.indexOf(st.search)>=0)
  })
}
function priorityClass(p){return p==='Urgente'?'prioUrgent':p==='Alta'?'prioHigh':p==='Baixa'?'prioLow':'prioNormal'}
function buyerCardsHtml(){
  var rows=filteredBuyerOrders();
  if(!rows.length)return '<div class="empty" style="grid-column:1/-1">Nenhum pedido nesta lista.</div>';
  return rows.map(function(o){
    var first=o.items[0],more=Math.max(0,o.items.length-1);
    var progress=Math.max(0,Math.min(100,Number(o.percent||0)));
    return '<article class="orderCard '+(o.workflow_status==='Novo'?'new':'')+'" data-n="'+o.number+'">'+
      '<div class="orderCardTop"><div><span class="orderLabel">PEDIDO</span><div class="orderNumber">'+esc(o.number)+'</div></div><div class="orderBadges">'+badge(o.workflow_status)+'<span class="priorityPill '+priorityClass(o.priority)+'">'+esc(o.priority||'Normal')+'</span></div></div>'+
      '<div class="supplierBlock"><span>Fornecedor</span><b>'+esc(o.supplier.name||'Fornecedor não informado')+'</b></div>'+
      '<div class="mainItem"><span>Item principal</span><b>'+esc(first?first.description:'Sem descrição')+'</b><small>'+(first?(first.quantity+' '+esc(first.unit||'')+(first.code?' · cód. '+esc(first.code):'')):'')+(more? ' · +'+more+' item(ns)':'')+'</small></div>'+
      '<div class="orderFacts"><div><span>Entrega</span><b>'+(o.delivery_type?esc(o.delivery_type):'—')+'</b></div><div><span>Prazo ERP</span><b>'+fmtDate(o.system_due_date)+'</b></div><div><span>Proposta</span><b>'+fmtDate(o.proposal_due_date)+'</b></div><div><span>Alteração</span><b>'+fmtDate(o.last_modified_at)+'</b></div></div>'+
      '<div class="deliveryProgress"><div><span>Entrega física</span><b>'+progress+'%</b></div><div class="progressTrack"><i style="width:'+progress+'%"></i></div></div>'+
      '<div class="orderCardFoot"><span>'+o.items.length+' item(ns) · '+esc(o.situation)+'</span><button type="button">Abrir pedido <b>→</b></button></div>'+
    '</article>'
  }).join('')
}
function bindBuyerCards(){document.querySelectorAll('.orderCard[data-n]').forEach(function(card){card.onclick=function(){openOrder(card.dataset.n)}})}
function updateBuyerCards(){var g=document.getElementById('buyerGrid');if(!g)return;g.innerHTML=buyerCardsHtml();bindBuyerCards()}
function syncBuyerTabs(){document.querySelectorAll('[data-t]').forEach(function(b){b.classList.toggle('on',b.dataset.t===st.tab)})}
function render(){
  var html='<div class="stats"><div class="stat" data-tab="Novo"><small>Novos pedidos</small><strong>'+count('Novo')+'</strong></div><div class="stat" data-tab="Pendente"><small>Pendentes</small><strong>'+count('Pendente')+'</strong></div><div class="stat" data-tab="Preenchido"><small>Preenchidos</small><strong>'+count('Preenchido')+'</strong></div></div>';
  html+=buyerDashboardHtml();
  html+='<div class="bar"><input class="search" id="search" placeholder="Buscar número, fornecedor ou item…" value="'+esc(st.search)+'"><div class="tabs"><button data-t="Novo" class="'+(st.tab==='Novo'?'on':'')+'">Novos</button><button data-t="Pendente" class="'+(st.tab==='Pendente'?'on':'')+'">Pendentes</button><button data-t="Preenchido" class="'+(st.tab==='Preenchido'?'on':'')+'">Preenchidos</button><button data-t="" class="'+(st.tab===''?'on':'')+'">Todos</button></div></div><div class="ordersGrid" id="buyerGrid">'+buyerCardsHtml()+'</div>';
  document.getElementById('view').innerHTML=html;
  document.getElementById('search').oninput=function(){st.search=this.value.toLowerCase();updateBuyerCards()};
  document.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){st.tab=b.dataset.t;syncBuyerTabs();updateBuyerCards()}});
  document.querySelectorAll('.stat').forEach(function(card){card.onclick=function(){st.tab=card.dataset.tab;syncBuyerTabs();updateBuyerCards()}});
  bindBuyerCards()
}
async function openOrder(n){
  var o=await (await req('/api/orders/'+n)).json();
  st.current=o;st.priority=o.priority||'Normal';st.delivery=o.delivery_type||'';
  var d=document.getElementById('drawer');
  var items=o.items.map(function(i){
    var q=Number(i.quantity||0),del=Number(i.delivered||0),pct=q?Math.min(100,Math.round(del/q*100)):0;
    return '<div class="detailItem"><div class="detailItemTop"><div><span>'+esc(i.code||'Sem código')+'</span><b>'+esc(i.description)+'</b></div><strong>'+q+' '+esc(i.unit||'')+'</strong></div><div class="detailItemMeta"><span>Entregue: '+del+'</span><span>Saldo: '+Math.max(0,q-del)+'</span><span>'+pct+'%</span></div><div class="itemProgress"><i style="width:'+pct+'%"></i></div></div>'
  }).join('');
  d.innerHTML='<div class="detailHero"><button class="x" id="closeD">×</button><div class="detailStatus">'+badge(o.workflow_status)+'<span class="priorityPill '+priorityClass(o.priority)+'">'+esc(o.priority||'Normal')+'</span></div><span class="detailEyebrow">PEDIDO DE COMPRA</span><h2>'+esc(o.number)+'</h2><p>'+esc(o.supplier.name||'Fornecedor não informado')+'</p></div>'+
  '<div class="body detailBody">'+
    '<div class="detailSummary"><div><span>Prazo ERP</span><b>'+fmtDate(o.system_due_date)+'</b></div><div><span>Previsão proposta</span><b>'+fmtDate(o.proposal_due_date)+'</b></div><div><span>Tipo de entrega</span><b>'+(o.delivery_type?esc(o.delivery_type):'—')+'</b></div></div>'+
    '<div class="section">Itens do pedido <span class="sectionCount">'+o.items.length+'</span></div><div class="detailItems">'+items+'</div>'+
    '<div class="section">Informações do comprador</div><div class="form detailForm"><label>Data de envio ao fornecedor<input id="sent" type="date" value="'+esc(o.sent_at||'')+'"></label><label>Previsão de entrega da proposta <span class="optional">(opcional)</span><input id="proposalDue" type="date" value="'+esc(o.proposal_due_date||'')+'"></label><label class="wideLabel">Tipo de entrega<div class="delivery"><button type="button" class="choice" data-d="COLETA">↙ Coleta</button><button type="button" class="choice" data-d="ENTREGA">→ Entrega</button></div></label><label class="wideLabel">Prioridade<div class="prior"><button type="button" data-p="Baixa">Baixa</button><button type="button" data-p="Normal">Normal</button><button type="button" data-p="Alta">Alta</button><button type="button" data-p="Urgente">Urgente</button></div></label><label class="wideLabel">Observação<textarea id="obs" rows="4" placeholder="Inclua apenas informações úteis para o acompanhamento">'+esc(o.entry_notes||'')+'</textarea></label><button class="btn detailSave" id="save">Salvar informações</button></div>'+
    '<div class="auditCard"><div><span>Responsável</span><b>'+esc(o.buyer_name||st.user.name)+'</b></div><div><span>Última alteração</span><b>'+fmtDT(o.last_modified_at)+'</b></div>'+(o.source_file?'<div><span>Origem</span><b>'+esc(o.source_file)+'</b></div>':'')+'</div>'+
  '</div>';
  d.classList.add('on');document.getElementById('ov').classList.add('on');
  document.getElementById('closeD').onclick=closeDrawer;document.getElementById('ov').onclick=closeDrawer;
  paintChoices();
  document.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){st.delivery=b.dataset.d;paintChoices()}});
  document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){st.priority=b.dataset.p;paintChoices()}});
  document.getElementById('save').onclick=saveOrder;
  ['sent','proposalDue'].forEach(function(id){var el=document.getElementById(id);if(el)el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();saveOrder()}})})
}
function paintChoices(){document.querySelectorAll('[data-d]').forEach(function(b){b.classList.toggle('on',b.dataset.d===st.delivery)});document.querySelectorAll('[data-p]').forEach(function(b){b.classList.toggle('on',b.dataset.p===st.priority)})}
async function saveOrder(){
  var sentEl=document.getElementById('sent');
  var obsEl=document.getElementById('obs');
  var proposalEl=document.getElementById('proposalDue');
  if(!sentEl||!sentEl.value)return toast('Informe a data de envio ao fornecedor');
  if(!st.delivery)return toast('Selecione Coleta ou Entrega');
  try{
    await req('/api/orders/'+st.current.number+'/buyer-submit',{method:'POST',body:JSON.stringify({sent_at:sentEl.value,proposal_due_date:proposalEl?proposalEl.value:'',delivery_type:st.delivery,priority:st.priority,entry_notes:obsEl?obsEl.value:''})});
    toast('Pedido preenchido com sucesso');
    closeDrawer();
    await refresh();
    st.tab='Preenchido';
    render()
  }catch(e){toast(e.message||'Não foi possível salvar')}
}
function closeDrawer(){document.getElementById('drawer').classList.remove('on');document.getElementById('ov').classList.remove('on')}
function openPassword(){
  var d=document.getElementById('drawer');
  d.innerHTML='<div class="head"><button class="x" id="closeD">×</button><span class="badge tag">Segurança</span><h2>Alterar senha</h2><div class="muted">Defina uma senha pessoal diferente da temporária.</div></div><div class="body"><div class="passwordBox"><label>Senha atual<input id="currentPass" type="password" autocomplete="current-password" placeholder="Senha atual"></label><label>Nova senha<input id="newPass" type="password" autocomplete="new-password" placeholder="Mínimo de 6 caracteres"></label><label>Confirmar nova senha<input id="confirmPass" type="password" autocomplete="new-password" placeholder="Repita a nova senha"></label><button class="btn" id="savePass">Alterar senha</button></div></div>';
  d.classList.add('on');
  document.getElementById('ov').classList.add('on');
  document.getElementById('closeD').onclick=closeDrawer;
  document.getElementById('ov').onclick=closeDrawer;
  document.getElementById('savePass').onclick=changePassword;
  ['currentPass','newPass','confirmPass'].forEach(function(id){document.getElementById(id).addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();changePassword()}})})
}
async function changePassword(){
  var current=document.getElementById('currentPass').value;
  var next=document.getElementById('newPass').value;
  var confirm=document.getElementById('confirmPass').value;
  if(!current||!next||!confirm)return toast('Preencha as três senhas');
  if(next!==confirm)return toast('A confirmação não confere');
  try{
    await req('/api/change-password',{method:'POST',body:JSON.stringify({current_password:current,new_password:next})});
    st.user.must_change_password=false;
    toast('Senha alterada com sucesso');
    closeDrawer()
  }catch(e){toast(e.message)}
}
function connectEvents(){if(st.event)st.event.close();var es=new EventSource('/api/events');st.event=es;es.onopen=function(){liveText.textContent='tempo real';dot.style.background='#22c55e'};es.onmessage=async function(ev){try{var m=JSON.parse(ev.data);if(m.type==='import.completed'){toast((m.payload.created||0)+' novo(s) pedido(s) importado(s)');st.tab='Novo'}else if(m.type==='order.updated')toast('Um pedido foi atualizado');await refresh()}catch(e){}};es.onerror=function(){liveText.textContent='verificando versão…';dot.style.background='#f59e0b';fetch('/api/bootstrap',{credentials:'include'}).then(function(r){return r.json()}).then(function(b){if(!b.user)location=b.update_required?'/?updated=1':'/'}).catch(function(){})}}
setInterval(function(){if(st.user)refresh().catch(function(){})},20000);boot();
</script>
</body></html>
