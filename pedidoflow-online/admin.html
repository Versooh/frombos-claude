<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PedidoFlow — Administração</title>
<style>
:root{--bg:#f3f6fb;--panel:#fff;--panel2:#f8fafc;--text:#152238;--muted:#6b7890;--line:#dfe6ef;--blue:#2563eb;--blue2:#dbeafe;--green:#15803d;--green2:#dcfce7;--amber:#b45309;--amber2:#fef3c7;--red:#b91c1c;--red2:#fee2e2;--purple:#6d28d9;--purple2:#ede9fe;--shadow:0 14px 38px rgba(26,43,72,.08)}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.shell{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{background:#0e1a2b;color:#dce5f3;padding:18px 14px;position:sticky;top:0;height:100vh}.brand{font-size:19px;font-weight:850;letter-spacing:-.02em;padding:5px 8px 19px}.brand b{color:#60a5fa}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aebbd0;text-align:left;border-radius:9px;padding:10px 11px}.nav button:hover,.nav button.on{background:#18283f;color:#fff}.sidefoot{position:absolute;bottom:18px;left:14px;right:14px;font-size:12px;color:#8999b2}
.main{min-width:0}.top{height:62px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;position:sticky;top:0;z-index:5}.top h1{font-size:17px;margin:0}.live{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 5px #22c55e18;animation:pulse 1.6s infinite}@keyframes pulse{50%{opacity:.35;box-shadow:0 0 0 10px #22c55e06}}
.user{margin-left:18px;font-weight:650}.content{max-width:1450px;margin:auto;padding:20px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(145px,1fr));gap:11px;margin-bottom:14px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px;box-shadow:0 2px 10px #1e293b08;animation:rise .35s both}.kpi:nth-child(2){animation-delay:.04s}.kpi:nth-child(3){animation-delay:.08s}.kpi:nth-child(4){animation-delay:.12s}.kpi:nth-child(5){animation-delay:.16s}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.kpi small{display:block;color:var(--muted);font-weight:650}.kpi strong{display:block;font-size:28px;line-height:1.15;margin-top:5px}.kpi.click{cursor:pointer}.kpi.click:hover{border-color:#a9c5f8;transform:translateY(-1px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.toolbar{display:flex;gap:8px;align-items:center;padding:11px;border-bottom:1px solid var(--line);flex-wrap:wrap}.toolbar input{flex:1;min-width:230px}.inp,select,input,textarea{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:9px 10px;outline:none}.inp:focus,select:focus,input:focus,textarea:focus{border-color:#7aa6f7;box-shadow:0 0 0 3px #2563eb12}.btn{border:0;border-radius:9px;padding:9px 13px;background:var(--blue);color:#fff;font-weight:750}.btn:hover{filter:brightness(.97);transform:translateY(-1px)}.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.dark{background:#172033}
.tablewrap{overflow:auto;max-height:calc(100vh - 260px)}table{width:100%;border-collapse:separate;border-spacing:0;min-width:1050px}th{position:sticky;top:0;background:#f8fafc;color:#708097;text-transform:uppercase;font-size:10.5px;letter-spacing:.055em;text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);z-index:1}td{padding:10px 11px;border-bottom:1px solid #edf1f6;vertical-align:top}tr.data{cursor:pointer;transition:.15s}tr.data:hover td{background:#f7faff}.ord{font-weight:850}.desc{max-width:310px;color:#344258}.sub{color:var(--muted);font-size:12px;margin-top:2px}.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}.novo{background:var(--blue2);color:#1d4ed8}.pendente{background:var(--amber2);color:var(--amber)}.preenchido{background:var(--green2);color:var(--green)}.atrasado{background:var(--red2);color:var(--red)}.parcial{background:var(--purple2);color:var(--purple)}.tag{background:#eef2f7;color:#526178}
.newrow td:first-child{box-shadow:inset 3px 0 0 #2563eb}.newrow .badge.novo{animation:glow 1.8s infinite}@keyframes glow{50%{box-shadow:0 0 0 5px #2563eb12}}
.empty{text-align:center;color:var(--muted);padding:42px}
.overlay{position:fixed;inset:0;background:#0f172a66;opacity:0;pointer-events:none;transition:.2s;z-index:20}.overlay.on{opacity:1;pointer-events:auto}.drawer{position:fixed;inset:0 0 0 auto;width:min(570px,100%);background:#fff;z-index:21;transform:translateX(102%);transition:.24s cubic-bezier(.2,.8,.2,1);box-shadow:-22px 0 60px #0f172a25;overflow:auto}.drawer.on{transform:none}.drawerhead{padding:18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fffffff5;backdrop-filter:blur(8px);z-index:2}.drawerbody{padding:16px}.x{float:right;border:0;background:#eef2f7;width:32px;height:32px;border-radius:8px}.section{margin:18px 0 7px;color:#7b889c;font-size:11px;text-transform:uppercase;font-weight:850;letter-spacing:.06em}.item{border:1px solid var(--line);border-radius:10px;padding:10px;margin:7px 0}.item b{display:block}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.formgrid label{display:grid;gap:4px;font-size:12px;font-weight:700}.formgrid .wide{grid-column:1/-1}.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);width:min(560px,calc(100% - 28px));background:#fff;border-radius:14px;z-index:25;padding:18px;box-shadow:0 30px 80px #0f172a35;opacity:0;pointer-events:none;transition:.2s}.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}.modal h2{margin:0 0 12px}.modal .stack{display:grid;gap:8px}
#toast{position:fixed;right:18px;bottom:18px;max-width:390px;background:#162033;color:#fff;padding:11px 14px;border-radius:10px;z-index:40;transform:translateY(90px);opacity:0;transition:.25s;box-shadow:0 14px 40px #0003}#toast.on{transform:none;opacity:1}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(510px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow);animation:rise .35s}.authbox h1{margin:0;font-size:25px}.authbox p{color:var(--muted);margin-top:5px}.authbox .stack{display:grid;gap:9px;margin-top:18px}.authbox input{width:100%}
@media(max-width:920px){.shell{grid-template-columns:1fr}.side{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.content{padding:12px}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.tablewrap{max-height:none}}
</style>
<style>
:root{
  --flow-cyan:#22d3ee;
  --flow-blue:#2563eb;
  --flow-indigo:#4f46e5;
  --flow-ink:#0b1220;
  --flow-slate:#142033;
}
body{
  background:
    radial-gradient(circle at 8% 5%, rgba(37,99,235,.09), transparent 28%),
    radial-gradient(circle at 92% 8%, rgba(34,211,238,.07), transparent 24%),
    linear-gradient(180deg,#f5f8fd 0%,#eef3f9 100%);
}
.side{
  background:
    linear-gradient(180deg,rgba(9,17,31,.98),rgba(14,26,43,.98)),
    radial-gradient(circle at 10% 0%,rgba(34,211,238,.18),transparent 24%);
  border-right:1px solid rgba(255,255,255,.05);
  overflow:hidden;
}
.side:before{
  content:"";position:absolute;left:19px;top:75px;bottom:74px;width:2px;
  background:linear-gradient(180deg,transparent,var(--flow-cyan),var(--flow-blue),transparent);
  opacity:.38;filter:drop-shadow(0 0 8px rgba(34,211,238,.55));
}
.side:after{
  content:"";position:absolute;width:180px;height:180px;border-radius:50%;
  border:1px solid rgba(34,211,238,.08);right:-95px;bottom:80px;
  box-shadow:0 0 0 28px rgba(37,99,235,.025),0 0 0 56px rgba(34,211,238,.018);
}
.brand{position:relative;padding-left:12px;font-size:20px;letter-spacing:-.04em}
.brand:before{
  content:"";display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:9px;
  background:linear-gradient(135deg,var(--flow-cyan),var(--flow-blue));
  box-shadow:0 0 18px rgba(34,211,238,.55);transform:rotate(45deg)
}
.brand b{background:linear-gradient(90deg,var(--flow-cyan),#60a5fa);-webkit-background-clip:text;color:transparent}
.nav button{position:relative;padding-left:17px;transition:transform .18s ease,background .18s ease,color .18s ease}
.nav button:hover{transform:translateX(3px)}
.nav button.on{
  background:linear-gradient(90deg,rgba(37,99,235,.22),rgba(34,211,238,.06));
  color:#fff;box-shadow:inset 2px 0 0 var(--flow-cyan)
}
.top{
  border-bottom:1px solid rgba(165,180,202,.28);
  box-shadow:0 8px 30px rgba(15,23,42,.035)
}
.top h1{letter-spacing:-.02em}
.live{
  background:#f1f5f9;border:1px solid #e2e8f0;padding:5px 9px;border-radius:999px
}
.kpi{
  position:relative;overflow:hidden;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease
}
.kpi:after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,var(--flow-blue),var(--flow-cyan));opacity:.55
}
.kpi:hover{box-shadow:0 14px 30px rgba(37,99,235,.08)}
.card{border-color:#dfe7f0}
.toolbar{background:linear-gradient(180deg,#fff,#fbfdff)}
.btn{
  background:linear-gradient(135deg,var(--flow-blue),var(--flow-indigo));
  box-shadow:0 8px 18px rgba(37,99,235,.16);transition:.18s ease
}
.btn:hover{box-shadow:0 12px 24px rgba(37,99,235,.24)}
.drawer{
  border-left:1px solid #dce7f3;
  background:
    radial-gradient(circle at 100% 0%,rgba(34,211,238,.06),transparent 28%),#fff
}
.drawerhead:before{
  content:"";position:absolute;left:0;top:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--flow-blue),var(--flow-cyan))
}
.auth{
  background:
    radial-gradient(circle at 12% 20%,rgba(37,99,235,.14),transparent 26%),
    radial-gradient(circle at 85% 18%,rgba(34,211,238,.10),transparent 24%),
    linear-gradient(135deg,#eef4fb,#f8fbff 60%,#edf5fb);
  position:relative;overflow:hidden
}
.auth:before,.auth:after{
  content:"";position:absolute;border-radius:50%;pointer-events:none
}
.auth:before{
  width:420px;height:420px;border:1px solid rgba(37,99,235,.08);right:-220px;top:-180px;
  box-shadow:0 0 0 48px rgba(37,99,235,.025),0 0 0 96px rgba(34,211,238,.018)
}
.auth:after{
  width:260px;height:260px;border:1px solid rgba(34,211,238,.08);left:-150px;bottom:-120px
}
.authbox{
  position:relative;z-index:1;border:1px solid rgba(203,213,225,.75);
  box-shadow:0 30px 90px rgba(27,48,83,.12);padding:28px;
  background:rgba(255,255,255,.93);backdrop-filter:blur(16px)
}
.authbox:before{
  content:"";display:block;width:44px;height:5px;border-radius:999px;margin-bottom:18px;
  background:linear-gradient(90deg,var(--flow-blue),var(--flow-cyan));
  box-shadow:0 0 18px rgba(34,211,238,.28)
}
.authbox h1{letter-spacing:-.035em}
.authbox input{transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
.authbox input:focus{transform:translateY(-1px)}
.badge{border:1px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.38)}
tr.data td{transition:background .16s ease,transform .16s ease}
tr.data:hover td:first-child{box-shadow:inset 3px 0 0 var(--flow-cyan)}
#toast{background:linear-gradient(135deg,#0f172a,#172554);border:1px solid rgba(96,165,250,.2)}
</style></head>
<body>
<div id="root"></div>
<div class="overlay" id="ov"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal" id="modal"></div>
<div id="toast"></div>
<script>
var state={user:null,orders:[],users:[],search:'',workflow:'',buyer:'',events:null};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]})}
function fmtDate(v){if(!v)return '—';var d=new Date(v.length===10?v+'T00:00:00':v);return isNaN(d)?'—':d.toLocaleDateString('pt-BR')}
function fmtDT(v){if(!v)return '—';var d=new Date(v);return isNaN(d)?'—':d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('on');clearTimeout(window._tt);window._tt=setTimeout(function(){e.classList.remove('on')},2800)}
async function req(url,opt){opt=opt||{};var h=opt.body instanceof FormData?{}:{'Content-Type':'application/json'};var r=await fetch(url,Object.assign({credentials:'include',headers:h},opt));if(!r.ok){var t=await r.text();throw new Error(t)}return r}
async function boot(){var b=await (await fetch('/api/bootstrap',{credentials:'include'})).json();if(!b.initialized)return renderSetup();if(!b.user)return renderLogin();if(b.user.role!=='admin'){location='/comprador';return}state.user=b.user;renderShell();await refreshAll();connectEvents()}
function renderSetup(){document.getElementById('root').innerHTML='<div class="auth"><div class="authbox"><h1>Configurar PedidoFlow</h1><p>Crie o primeiro acesso administrativo.</p><div class="stack"><input id="company" placeholder="Empresa"><input id="name" placeholder="Nome do administrador"><input id="username" autocomplete="username" placeholder="Usuário do administrador"><input id="password" type="password" autocomplete="new-password" placeholder="Senha (mín. 6 caracteres)"><button class="btn" id="setupBtn">Criar ambiente</button></div></div></div>';document.getElementById('setupBtn').onclick=setup}
async function setup(){
  var payload={
    company:document.getElementById('company').value.trim(),
    name:document.getElementById('name').value.trim(),
    username:document.getElementById('username').value.trim(),
    password:document.getElementById('password').value
  };
  if(!payload.company||!payload.name||!payload.username||!payload.password){return toast('Preencha empresa, nome, usuário e senha')}
  try{
    await req('/api/setup',{method:'POST',body:JSON.stringify(payload)});
    toast('Ambiente criado com sucesso');
    setTimeout(function(){location.reload()},350)
  }catch(e){toast('Não foi possível configurar: '+e.message)}
}
function renderLogin(){document.getElementById('root').innerHTML='<div class="auth"><div class="authbox"><h1>PedidoFlow</h1><p>Acesso exclusivo da Administração</p><div class="stack"><input id="username" autocomplete="username" placeholder="Usuário administrador"><input id="password" type="password" autocomplete="current-password" placeholder="Senha"><button class="btn" id="loginBtn">Entrar como administrador</button></div></div></div>';document.getElementById('loginBtn').onclick=login}
async function login(){
  var payload={
    username:document.getElementById('username').value.trim(),
    password:document.getElementById('password').value
  };
  if(!payload.username||!payload.password){return toast('Informe usuário e senha')}
  try{await req('/api/login/admin',{method:'POST',body:JSON.stringify(payload)});location.reload()}
  catch(e){toast('Usuário ou senha inválidos')}
}
function renderShell(){document.getElementById('root').innerHTML='<div class="shell"><aside class="side"><div class="brand">Pedido<b>Flow</b></div><div class="nav"><button class="on" id="navOrders">▦ Pedidos</button><button id="navImport">⇧ Importar</button><button id="navUsers">👤 Compradores</button><button id="navExport">⇩ Exportar</button></div><div class="sidefoot">Coleta operacional de compras<br>Funcionalidade em homologação</div></aside><div class="main"><header class="top"><h1>Acompanhamento de pedidos</h1><div class="live"><span class="dot" id="liveDot"></span><span id="liveText">tempo real</span></div><div class="user">'+esc(state.user.name)+'</div></header><main class="content"><div id="view"></div></main></div></div>';navImport.onclick=openImport;navUsers.onclick=openUsers;navExport.onclick=function(){location.href='/api/export.xlsx'};navOrders.onclick=function(){renderOrders()}}
async function refreshAll(){var rs=await Promise.all([req('/api/orders'),req('/api/users')]);state.orders=await rs[0].json();state.users=await rs[1].json();renderOrders()}
function counts(){var o=state.orders;return {all:o.length,new:o.filter(function(x){return x.workflow_status==='Novo'}).length,pending:o.filter(function(x){return x.workflow_status==='Pendente'}).length,filled:o.filter(function(x){return x.workflow_status==='Preenchido'}).length,today:o.filter(function(x){if(!x.last_modified_at)return false;var d=new Date(x.last_modified_at),n=new Date();return d.toDateString()===n.toDateString()}).length}}
function workflowBadge(s){var c=s==='Novo'?'novo':s==='Pendente'?'pendente':'preenchido';return '<span class="badge '+c+'">'+esc(s)+'</span>'}
function operationalBadge(s){var c=s==='Atrasado'?'atrasado':s==='Entrega parcial'?'parcial':'tag';return '<span class="badge '+c+'">'+esc(s)+'</span>'}
function filtered(){return state.orders.filter(function(o){var text=(o.number+' '+o.supplier.name+' '+o.items.map(function(i){return i.description+' '+i.code}).join(' ')+' '+(o.buyer_name||'')).toLowerCase();return (!state.search||text.indexOf(state.search)>=0)&&(!state.workflow||o.workflow_status===state.workflow)&&(!state.buyer||String(o.buyer_id||'')===state.buyer)})}
function renderOrders(){if(!state.user)return;var c=counts(),rows=filtered();var html='<div class="kpis"><div class="kpi click" data-w=""><small>Total importados</small><strong>'+c.all+'</strong></div><div class="kpi click" data-w="Novo"><small>Novos pedidos</small><strong>'+c.new+'</strong></div><div class="kpi click" data-w="Pendente"><small>Pendentes</small><strong>'+c.pending+'</strong></div><div class="kpi click" data-w="Preenchido"><small>Preenchidos</small><strong>'+c.filled+'</strong></div><div class="kpi"><small>Alterados hoje</small><strong>'+c.today+'</strong></div></div>';
html+='<section class="card"><div class="toolbar"><input id="search" class="inp" placeholder="Buscar pedido, fornecedor, item ou comprador…" value="'+esc(state.search)+'"><select id="wf"><option value="">Todos os preenchimentos</option><option>Novo</option><option>Pendente</option><option>Preenchido</option></select><select id="bf"><option value="">Todos compradores</option>'+state.users.filter(function(u){return u.role==='buyer'}).map(function(u){return '<option value="'+u.id+'">'+esc(u.name)+'</option>'}).join('')+'</select><button class="btn ghost" id="refreshBtn">Atualizar</button></div><div class="tablewrap"><table><thead><tr><th>Pedido</th><th>Descrição do item</th><th>Fornecedor</th><th>Comprador</th><th>Entrega</th><th>Preenchimento</th><th>Acompanhamento</th><th>Última alteração</th></tr></thead><tbody>';
if(!rows.length)html+='<tr><td colspan="8" class="empty">Nenhum pedido encontrado.</td></tr>';
rows.forEach(function(o){var first=o.items[0],more=Math.max(o.items.length-1,0);html+='<tr class="data '+(o.workflow_status==='Novo'?'newrow':'')+'" data-n="'+o.number+'"><td><div class="ord">'+esc(o.number)+'</div><div class="sub">'+o.items.length+' item(ns)</div></td><td><div class="desc">'+esc(first?first.description:'Sem descrição')+'</div>'+(more?'<div class="sub">+'+more+' outro(s) item(ns)</div>':'')+'</td><td>'+esc(o.supplier.name||'—')+'</td><td>'+(o.buyer_name?esc(o.buyer_name):'<span class="sub">Não definido</span>')+'</td><td>'+(o.delivery_type?'<span class="badge tag">'+esc(o.delivery_type)+'</span>':'<span class="sub">—</span>')+'</td><td>'+workflowBadge(o.workflow_status)+'</td><td>'+operationalBadge(o.situation)+'</td><td><div>'+fmtDT(o.last_modified_at)+'</div><div class="sub">'+esc(o.last_modified_by||'Importação')+'</div></td></tr>'});
html+='</tbody></table></div></section>';document.getElementById('view').innerHTML=html;
document.querySelectorAll('.kpi.click').forEach(function(k){k.onclick=function(){state.workflow=k.dataset.w;renderOrders()}});
search.oninput=function(){state.search=this.value.toLowerCase();renderOrders()};wf.value=state.workflow;wf.onchange=function(){state.workflow=this.value;renderOrders()};bf.value=state.buyer;bf.onchange=function(){state.buyer=this.value;renderOrders()};refreshBtn.onclick=refreshAll;
document.querySelectorAll('tr.data').forEach(function(r){r.onclick=function(){openOrder(r.dataset.n)}})}
async function openOrder(n){var o=await (await req('/api/orders/'+n)).json(),d=document.getElementById('drawer'),ov=document.getElementById('ov');var items=o.items.map(function(i){return '<div class="item"><b>'+esc(i.description)+'</b><div class="sub">Código '+esc(i.code||'—')+' · '+i.quantity+' '+esc(i.unit||'')+' · entregue '+i.delivered+'</div></div>'}).join('');
d.innerHTML='<div class="drawerhead"><button class="x" id="closeD">×</button><div class="sub">'+workflowBadge(o.workflow_status)+'</div><h2 style="margin:5px 0 2px">Pedido '+esc(o.number)+'</h2><div class="sub">'+esc(o.supplier.name)+'</div></div><div class="drawerbody"><div class="section">Itens do pedido</div>'+items+'<div class="section">Dados do comprador</div><div class="formgrid"><label>Comprador<input value="'+esc(o.buyer_name||'')+'" disabled></label><label>Tipo de entrega<select id="delivery"><option value="">Não informado</option><option value="COLETA">Coleta</option><option value="ENTREGA">Entrega</option></select></label><label>Data de envio<input value="'+esc(o.sent_at||'')+'" disabled></label><label>Prioridade<input value="'+esc(o.priority||'Normal')+'" disabled></label><label class="wide">Observação inicial<textarea rows="2" disabled>'+esc(o.entry_notes||'')+'</textarea></label></div><div class="section">Acompanhamento</div><div class="formgrid"><label>Prazo fornecedor<input id="due" type="date" value="'+esc(o.supplier_due_date||'')+'"></label><label>Status fornecedor<input id="status" value="'+esc(o.supplier_status||'')+'" placeholder="Ex.: Em separação"></label><label>Próxima cobrança<input id="next" type="date" value="'+esc(o.next_follow_up||'')+'"></label><label class="wide">Observações<textarea id="track" rows="3">'+esc(o.tracking_notes||'')+'</textarea></label><div class="wide"><button class="btn" id="saveAdmin">Salvar acompanhamento</button></div></div><div class="section">Última alteração</div><div>'+fmtDT(o.last_modified_at)+' · '+esc(o.last_modified_by||'Importação')+'</div></div>';
delivery.value=o.delivery_type||'';d.classList.add('on');ov.classList.add('on');closeD.onclick=closeDrawer;ov.onclick=closeDrawer;saveAdmin.onclick=async function(){try{await req('/api/orders/'+o.number,{method:'PATCH',body:JSON.stringify({delivery_type:delivery.value,supplier_due_date:due.value,supplier_status:status.value,next_follow_up:next.value,tracking_notes:track.value})});toast('Pedido atualizado');closeDrawer();await refreshAll()}catch(e){toast('Erro ao salvar')}}}
function closeDrawer(){drawer.classList.remove('on');ov.classList.remove('on')}
function openModal(html){modal.innerHTML=html;ov.classList.add('on');modal.classList.add('on');ov.onclick=closeModal}
function closeModal(){modal.classList.remove('on');ov.classList.remove('on');setTimeout(function(){modal.innerHTML=''},200)}
function openImport(){openModal('<h2>Importar planilhas</h2><div class="stack"><label>Relatório ERP de pedidos</label><input id="orderFile" type="file" accept=".xlsx"><button class="btn" id="impOrders">Importar pedidos</button><hr style="border:0;border-top:1px solid var(--line);width:100%"><label>Ficha cadastral de fornecedores</label><input id="supplierFile" type="file" accept=".xlsx"><button class="btn ghost" id="impSuppliers">Importar fornecedores</button><button class="btn ghost" id="cancelM">Fechar</button></div>');impOrders.onclick=function(){upload('orders',orderFile)};impSuppliers.onclick=function(){upload('suppliers',supplierFile)};cancelM.onclick=closeModal}
async function upload(kind,el){if(!el.files[0])return toast('Selecione o arquivo');var fd=new FormData();fd.append('file',el.files[0]);try{var r=await fetch('/api/import/'+kind,{method:'POST',credentials:'include',body:fd});var j=await r.json();if(!r.ok)throw new Error(j.detail||'Falha na importação');toast(kind==='orders'?'Pedidos importados: '+j.orders+' · itens: '+j.items:'Fornecedores importados: '+j.rows);closeModal();await refreshAll()}catch(e){toast('Importação: '+e.message)}}
function openUsers(){openModal('<h2>Novo comprador</h2><div class="stack"><input id="uname" placeholder="Nome do comprador"><input id="uusername" autocomplete="username" placeholder="Usuário do comprador"><input id="upass" type="password" autocomplete="new-password" placeholder="Senha temporária (mín. 6)"><button class="btn" id="createU">Criar comprador</button><button class="btn ghost" id="cancelU">Fechar</button></div>');createU.onclick=createUser;cancelU.onclick=closeModal}
async function createUser(){
  var payload={
    name:document.getElementById('uname').value.trim(),
    username:document.getElementById('uusername').value.trim(),
    password:document.getElementById('upass').value,
    role:'buyer'
  };
  if(!payload.name||!payload.username||!payload.password){return toast('Preencha nome, usuário e senha')}
  try{await req('/api/users',{method:'POST',body:JSON.stringify(payload)});toast('Comprador criado');closeModal();await refreshAll()}
  catch(e){toast('Não foi possível criar o comprador: '+e.message)}
}
function connectEvents(){if(state.events)state.events.close();var es=new EventSource('/api/events');state.events=es;es.onopen=function(){liveText.textContent='tempo real';liveDot.style.background='#22c55e'};es.onmessage=async function(ev){try{var m=JSON.parse(ev.data);if(m.type==='import.completed')toast('Nova importação recebida: '+(m.payload.created||0)+' novos pedidos');else if(m.type==='buyer.submitted')toast('Pedido '+m.payload.number+' preenchido por '+m.payload.buyer);await refreshAll()}catch(e){}};es.onerror=function(){liveText.textContent='reconectando…';liveDot.style.background='#f59e0b'}}
setInterval(function(){if(state.user)refreshAll().catch(function(){})},20000);boot();
</script>
</body></html>
