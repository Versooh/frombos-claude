<style>

.side{

  content:"";display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:9px;

.nav button{position:relative;padding-left:17px;transition:transform .18s ease,background .18s ease,color .18s ease}

.live{

}
.kpi{
  position:relative;overflow:hidden;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease
}
.kpi:after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2px;

}
.kpi:hover{box-shadow:0 14px 30px rgba(37,99,235,.08)}
.card{border-color:#dfe7f0}
.toolbar{background:linear-gradient(180deg,#fff,#fbfdff)}
.btn{

}
.btn:hover{box-shadow:0 12px 24px rgba(37,99,235,.24)}
.drawer{
  border-left:1px solid #dce7f3;
  background:
    radial-gradient(circle at 100% 0%,rgba(34,211,238,.06),transparent 28%),#fff
}
.drawerhead:before{
  content:"";position:absolute;left:0;top:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--flow-blue),var(--flow-cyan))
}
.auth{
  background:
    radial-gradient(circle at 12% 20%,rgba(37,99,235,.14),transparent 26%),
    radial-gradient(circle at 85% 18%,rgba(34,211,238,.10),transparent 24%),
    linear-gradient(135deg,#eef4fb,#f8fbff 60%,#edf5fb);
  position:relative;overflow:hidden
}
.auth:before,.auth:after{
  content:"";position:absolute;border-radius:50%;pointer-events:none
}
.auth:before{
  width:420px;height:420px;border:1px solid rgba(37,99,235,.08);right:-220px;top:-180px;
  box-shadow:0 0 0 48px rgba(37,99,235,.025),0 0 0 96px rgba(34,211,238,.018)

.auth:after{
  width:260px;height:260px;border:1px solid rgba(34,211,238,.08);left:-150px;bottom:-120px
}
.authbox{
  position:relative;z-index:1;border:1px solid rgba(203,213,225,.75);
  box-shadow:0 30px 90px rgba(27,48,83,.12);padding:28px;
  background:rgba(255,255,255,.93);backdrop-filter:blur(16px)
}
.authbox:before{
  content:"";display:block;width:44px;height:5px;border-radius:999px;margin-bottom:18px;
  background:linear-gradient(90deg,var(--flow-blue),var(--flow-cyan));
  box-shadow:0 0 18px rgba(34,211,238,.28)

.authbox h1{letter-spacing:-.035em}
.authbox input{transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
.authbox input:focus{transform:translateY(-1px)}
.badge{border:1px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.38)}
tr.data td{transition:background .16s ease,transform .16s ease}
tr.data:hover td:first-child{box-shadow:inset 3px 0 0 var(--flow-cyan)}
#toast{background:linear-gradient(135deg,#0f172a,#172554);border:1px solid rgba(96,165,250,.2)}

<body>
<div id="root"></div>
<div class="overlay" id="ov"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal" id="modal"></div>
<div id="toast"></div>
<script>
var state={user:null,orders:[],users:[],search:'',workflow:'',buyer:'',events:null};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]})}
function fmtDate(v){if(!v)return '—';var d=new Date(v.length===10?v+'T00:00:00':v);return isNaN(d)?'—':d.toLocaleDateString('pt-BR')}
function fmtDT(v){if(!v)return '—';var d=new Date(v);return isNaN(d)?'—':d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('on');clearTimeout(window._tt);window._tt=setTimeout(function(){e.classList.remove('on')},2800)}
async function req(url,opt){opt=opt||{};var h=opt.body instanceof FormData?{}:{'Content-Type':'application/json'};var r=await fetch(url,Object.assign({credentials:'include',headers:h},opt));if(r.status===401){location='/?updated=1';throw new Error('Sessão encerrada após atualização')}if(!r.ok){var msg='Erro na solicitação';try{var j=await r.json();msg=j.detail||msg}catch(e){try{msg=await r.text()}catch(_){}}throw new Error(msg)}return r}
async function boot(){var b=await (await fetch('/api/bootstrap',{credentials:'include'})).json();if(!b.user){location=b.update_required?'/?updated=1':'/';return}if(b.user.role!=='admin'){location='/painel';return}state.user=b.user;renderShell();await refreshAll();connectEvents()}
function renderSetup(){document.getElementById('root').innerHTML='<div class="auth"><div class="authbox"><h1>Configurar PedidoFlow</h1><p>Crie o primeiro acesso administrativo.</p><div class="stack"><input id="company" placeholder="Empresa"><input id="name" placeholder="Nome do administrador"><input id="username" autocomplete="username" placeholder="Usuário do administrador"><input id="password" type="password" autocomplete="new-password" placeholder="Senha (mín. 6 caracteres)"><button class="btn" id="setupBtn">Criar ambiente</button></div></div></div>';document.getElementById('setupBtn').onclick=setup}
async function setup(){
  var payload={
    company:document.getElementById('company').value.trim(),
    name:document.getElementById('name').value.trim(),
    username:document.getElementById('username').value.trim(),
    password:document.getElementById('password').value
  };
  if(!payload.company||!payload.name||!payload.username||!payload.password){return toast('Preencha empresa, nome, usuário e senha')}
  try{
    await req('/api/setup',{method:'POST',body:JSON.stringify(payload)});
    toast('Ambiente criado com sucesso');
    setTimeout(function(){location.reload()},350)
  }catch(e){toast('Não foi possível configurar: '+e.message)}
}
function renderLogin(){document.getElementById('root').innerHTML='<div class="auth"><div class="authbox"><h1>PedidoFlow</h1><p>Acesso exclusivo da Administração</p><div class="stack"><input id="username" autocomplete="username" placeholder="Usuário administrador"><input id="password" type="password" autocomplete="current-password" placeholder="Senha"><button class="btn" id="loginBtn">Entrar como administrador</button></div></div></div>';document.getElementById('loginBtn').onclick=login}
async function login(){
  var payload={
    username:document.getElementById('username').value.trim(),
    password:document.getElementById('password').value
  };
  if(!payload.username||!payload.password){return toast('Informe usuário e senha')}
  try{await req('/api/login/admin',{method:'POST',body:JSON.stringify(payload)});location.reload()}
  catch(e){toast('Usuário ou senha inválidos')}
}
function renderShell(){document.getElementById('root').innerHTML='<div class="shell"><aside class="side"><div class="brand">Pedido<b>Flow</b></div><div class="sideLabel">CENTRAL DE OPERAÇÃO</div><div class="nav"><button class="on" id="navOrders">▦ <span>Pedidos</span></button><button id="navImport">⇧ <span>Importar dados</span></button><button id="navUsers">👥 <span>Equipe</span></button><button id="navExport">⇩ <span>Exportar</span></button></div><div class="sidefoot"><div class="adminChip"><div class="avatar">W</div><div><b>'+esc(state.user.name)+'</b><small>Administrador</small></div></div><button class="logoutSide" id="changePassAdmin">Alterar senha</button><button class="logoutSide" id="logoutAdmin">Sair</button></div></aside><div class="main"><header class="top"><div><div class="topEyebrow">ADMINISTRAÇÃO</div><h1>Central de Pedidos</h1></div><div class="live"><span class="dot" id="liveDot"></span><span id="liveText">sincronizado</span></div></header><main class="content"><div class="heroAdmin"><div><span>FLUXO OPERACIONAL</span><h2>Acompanhe o que entrou, o que falta e o que já foi preenchido.</h2><p>Importações, compradores e alterações aparecem em um único fluxo.</p></div><div class="flowPulse"><i></i><i></i><i></i></div></div><div id="view"></div></main></div></div>';navImport.onclick=openImport;navUsers.onclick=openUsers;navExport.onclick=function(){location.href='/api/export.xlsx'};navOrders.onclick=function(){renderOrders()};changePassAdmin.onclick=openPassword;logoutAdmin.onclick=async function(){await req('/api/logout',{method:'POST'});location='/'}}
async function refreshAll(){var rs=await Promise.all([req('/api/orders'),req('/api/users')]);state.orders=await rs[0].json();state.users=await rs[1].json();renderOrders()}
function counts(){var o=state.orders;return {all:o.length,new:o.filter(function(x){return x.workflow_status==='Novo'}).length,pending:o.filter(function(x){return x.workflow_status==='Pendente'}).length,filled:o.filter(function(x){return x.workflow_status==='Preenchido'}).length,today:o.filter(function(x){if(!x.last_modified_at)return false;var d=new Date(x.last_modified_at),n=new Date();return d.toDateString()===n.toDateString()}).length}}
function workflowBadge(s){var c=s==='Novo'?'novo':s==='Pendente'?'pendente':'preenchido';return '<span class="badge '+c+'">'+esc(s)+'</span>'}
function operationalBadge(s){var c=s==='Atrasado'?'atrasado':s==='Entrega parcial'?'parcial':'tag';return '<span class="badge '+c+'">'+esc(s)+'</span>'}
function filtered(){return state.orders.filter(function(o){var text=(o.number+' '+o.supplier.name+' '+o.items.map(function(i){return i.description+' '+i.code}).join(' ')+' '+(o.buyer_name||'')).toLowerCase();return (!state.search||text.indexOf(state.search)>=0)&&(!state.workflow||o.workflow_status===state.workflow)&&(!state.buyer||String(o.buyer_id||'')===state.buyer)})}
function pct(n,t){return t?Math.round(n/t*100):0}
function adminDashboardHtml(){
  var total=state.orders.length||1;
  var novo=state.orders.filter(function(o){return o.workflow_status==='Novo'}).length;
  var pend=state.orders.filter(function(o){return o.workflow_status==='Pendente'}).length;
  var fill=state.orders.filter(function(o){return o.workflow_status==='Preenchido'}).length;
  var situations=['Atrasado','Entrega parcial','Cobrar hoje','Prazo próximo','Em acompanhamento','Concluído'];
  var priorities=['Urgente','Alta','Normal','Baixa'];
  var p1=pct(novo,total),p2=pct(pend,total);
  var donut='conic-gradient(#3b82f6 0 '+p1+'%,#f59e0b '+p1+'% '+(p1+p2)+'%,#22c55e '+(p1+p2)+'% 100%)';
  var smax=Math.max.apply(null,situations.map(function(s){return state.orders.filter(function(o){return o.situation===s}).length}).concat([1]));
  var pmax=Math.max.apply(null,priorities.map(function(s){return state.orders.filter(function(o){return o.priority===s}).length}).concat([1]));
  return '<section class="dashGrid"><div class="chartCard"><div class="chartHead"><div><span>VISÃO GERAL</span><h3>Preenchimento</h3></div><small>'+state.orders.length+' pedidos</small></div><div class="donutRow"><div class="donut" style="background:'+donut+'"><div><b>'+fill+'</b><small>preenchidos</small></div></div><div class="legend"><div><i class="cBlue"></i>Novo <b>'+novo+'</b></div><div><i class="cAmber"></i>Pendente <b>'+pend+'</b></div><div><i class="cGreen"></i>Preenchido <b>'+fill+'</b></div></div></div></div>'+
  '<div class="chartCard"><div class="chartHead"><div><span>OPERAÇÃO</span><h3>Situação dos pedidos</h3></div></div><div class="bars">'+situations.map(function(s){var n=state.orders.filter(function(o){return o.situation===s}).length;return '<div class="barLine"><label><span>'+esc(s)+'</span><b>'+n+'</b></label><div><i style="width:'+Math.round(n/smax*100)+'%"></i></div></div>'}).join('')+'</div></div>'+
  '<div class="chartCard"><div class="chartHead"><div><span>CARTEIRA</span><h3>Prioridades</h3></div></div><div class="bars priorityBars">'+priorities.map(function(s){var n=state.orders.filter(function(o){return o.priority===s}).length;return '<div class="barLine"><label><span>'+esc(s)+'</span><b>'+n+'</b></label><div><i data-p="'+s+'" style="width:'+Math.round(n/pmax*100)+'%"></i></div></div>'}).join('')+'</div></div></section>'
}
function adminRowsHtml(){
  var rows=filtered(),html='';
  if(!rows.length)return '<tr><td colspan="8" class="empty">Nenhum pedido encontrado.</td></tr>';
  rows.forEach(function(o){
    var first=o.items[0],more=Math.max(o.items.length-1,0);
    html+='<tr class="data '+(o.workflow_status==='Novo'?'newrow':'')+'" data-n="'+o.number+'"><td><div class="ord">'+esc(o.number)+'</div><div class="sub">'+o.items.length+' item(ns)</div></td><td><div class="desc">'+esc(first?first.description:'Sem descrição')+'</div>'+(more?'<div class="sub">+'+more+' outro(s) item(ns)</div>':'')+'</td><td>'+esc(o.supplier.name||'—')+'</td><td>'+(o.buyer_name?esc(o.buyer_name):'<span class="sub">Não definido</span>')+'</td><td>'+(o.delivery_type?'<span class="badge tag">'+esc(o.delivery_type)+'</span>':'<span class="sub">—</span>')+(o.proposal_due_date?'<div class="sub">Proposta: '+fmtDate(o.proposal_due_date)+'</div>':'')+'</td><td>'+workflowBadge(o.workflow_status)+'</td><td>'+operationalBadge(o.situation)+'</td><td><div>'+fmtDT(o.last_modified_at)+'</div><div class="sub">'+esc(o.last_modified_by||'Importação')+'</div></td></tr>'
  });
  return html
}
function bindAdminRows(){
  document.querySelectorAll('tr.data').forEach(function(r){r.onclick=function(){openOrder(r.dataset.n)}})
}
function updateAdminRows(){
  var body=document.getElementById('orderRows');
  if(!body)return;
  body.innerHTML=adminRowsHtml();
  bindAdminRows()
}
function renderOrders(){
  if(!state.user)return;
  var c=counts();
  var html='<div class="kpis"><div class="kpi click" data-w=""><small>Total importados</small><strong>'+c.all+'</strong></div><div class="kpi click" data-w="Novo"><small>Novos pedidos</small><strong>'+c.new+'</strong></div><div class="kpi click" data-w="Pendente"><small>Pendentes</small><strong>'+c.pending+'</strong></div><div class="kpi click" data-w="Preenchido"><small>Preenchidos</small><strong>'+c.filled+'</strong></div><div class="kpi"><small>Alterados hoje</small><strong>'+c.today+'</strong></div></div>';
  html+=adminDashboardHtml();
  html+='<section class="card ordersCard"><div class="toolbar"><input id="search" class="inp" placeholder="Buscar pedido, fornecedor, item ou comprador…" value="'+esc(state.search)+'"><select id="wf"><option value="">Todos os preenchimentos</option><option>Novo</option><option>Pendente</option><option>Preenchido</option></select><select id="bf"><option value="">Todos compradores</option>'+state.users.filter(function(u){return u.role==='buyer'}).map(function(u){return '<option value="'+u.id+'">'+esc(u.name)+'</option>'}).join('')+'</select><button class="btn ghost" id="refreshBtn">Atualizar</button></div><div class="tablewrap"><table><thead><tr><th>Pedido</th><th>Descrição do item</th><th>Fornecedor</th><th>Comprador</th><th>Entrega</th><th>Preenchimento</th><th>Acompanhamento</th><th>Última alteração</th></tr></thead><tbody id="orderRows">'+adminRowsHtml()+'</tbody></table></div></section>';
  document.getElementById('view').innerHTML=html;
  var searchEl=document.getElementById('search'),wfEl=document.getElementById('wf'),bfEl=document.getElementById('bf');
  wfEl.value=state.workflow;bfEl.value=state.buyer;
  searchEl.oninput=function(){state.search=this.value.toLowerCase();updateAdminRows()};
  wfEl.onchange=function(){state.workflow=this.value;updateAdminRows()};
  bfEl.onchange=function(){state.buyer=this.value;updateAdminRows()};
  document.getElementById('refreshBtn').onclick=refreshAll;
  document.querySelectorAll('.kpi.click').forEach(function(k){k.onclick=function(){state.workflow=k.dataset.w;wfEl.value=state.workflow;updateAdminRows()}});
  bindAdminRows()
}
async function openOrder(n){var o=await (await req('/api/orders/'+n)).json(),d=document.getElementById('drawer'),ov=document.getElementById('ov');var items=o.items.map(function(i){return '<div class="item"><b>'+esc(i.description)+'</b><div class="sub">Código '+esc(i.code||'—')+' · '+i.quantity+' '+esc(i.unit||'')+' · entregue '+i.delivered+'</div></div>'}).join('');
d.innerHTML='<div class="drawerhead"><button class="x" id="closeD">×</button><div class="sub">'+workflowBadge(o.workflow_status)+'</div><h2 style="margin:5px 0 2px">Pedido '+esc(o.number)+'</h2><div class="sub">'+esc(o.supplier.name)+'</div></div><div class="drawerbody"><div class="section">Itens do pedido</div>'+items+'<div class="section">Dados do comprador</div><div class="formgrid"><label>Comprador<input value="'+esc(o.buyer_name||'')+'" disabled></label><label>Tipo de entrega<select id="delivery"><option value="">Não informado</option><option value="COLETA">Coleta</option><option value="ENTREGA">Entrega</option></select></label><label>Data de envio<input value="'+esc(o.sent_at||'')+'" disabled></label><label>Prioridade<input value="'+esc(o.priority||'Normal')+'" disabled></label><label>Previsão entrega da proposta<input id="proposalDue" type="date" value="'+esc(o.proposal_due_date||'')+'"></label><label class="wide">Observação inicial<textarea rows="2" disabled>'+esc(o.entry_notes||'')+'</textarea></label></div><div class="section">Acompanhamento</div><div class="formgrid"><label>Prazo fornecedor<input id="due" type="date" value="'+esc(o.supplier_due_date||'')+'"></label><label>Status fornecedor<input id="status" value="'+esc(o.supplier_status||'')+'" placeholder="Ex.: Em separação"></label><label>Próxima cobrança<input id="next" type="date" value="'+esc(o.next_follow_up||'')+'"></label><label class="wide">Observações<textarea id="track" rows="3">'+esc(o.tracking_notes||'')+'</textarea></label><div class="wide"><button class="btn" id="saveAdmin">Salvar acompanhamento</button></div></div><div class="section">Última alteração</div><div>'+fmtDT(o.last_modified_at)+' · '+esc(o.last_modified_by||'Importação')+'</div></div>';
delivery.value=o.delivery_type||'';d.classList.add('on');ov.classList.add('on');closeD.onclick=closeDrawer;ov.onclick=closeDrawer;saveAdmin.onclick=async function(){try{await req('/api/orders/'+o.number,{method:'PATCH',body:JSON.stringify({delivery_type:delivery.value,proposal_due_date:proposalDue.value,supplier_due_date:due.value,supplier_status:status.value,next_follow_up:next.value,tracking_notes:track.value})});toast('Pedido atualizado');closeDrawer();await refreshAll()}catch(e){toast('Erro ao salvar')}};['proposalDue','due','status','next'].forEach(function(id){var el=document.getElementById(id);if(el)el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();saveAdmin.click()}})})}
function closeDrawer(){drawer.classList.remove('on');ov.classList.remove('on')}
function openModal(html){modal.innerHTML=html;ov.classList.add('on');modal.classList.add('on');ov.onclick=closeModal}
function closeModal(){modal.classList.remove('on');ov.classList.remove('on');setTimeout(function(){modal.innerHTML=''},200)}
async function openImport(){
  var historyRows=[];
  try{historyRows=await (await req('/api/import/history')).json()}catch(e){}
  var hist=historyRows.length?historyRows.map(function(h){
    return '<div class="importRow"><div class="importIcon">↥</div><div class="importMain"><b>'+esc(h.filename)+'</b><small>'+fmtDT(h.imported_at)+' · '+esc(h.imported_by||'Administrador')+'</small></div><div class="importStats"><span><b>'+h.new_orders+'</b> novos</span><span>'+h.skipped_orders+' preservados</span></div></div>'
  }).join(''):'<div class="importEmpty">Nenhuma importação registrada ainda.</div>';
  openModal('<div class="modalHead"><div><span class="micro">IMPORTAÇÃO INCREMENTAL</span><h2>Adicionar novos pedidos</h2><p>Pedidos já existentes são preservados. Somente números novos entram na base.</p></div></div><div class="importBox"><label>Relatório ERP de pedidos (.xlsx)</label><input id="orderFile" type="file" accept=".xlsx"><button class="btn" id="impOrders">Importar novos pedidos</button></div><div class="divider"></div><div class="modalHead"><div><span class="micro">HISTÓRICO</span><h2>Importações anteriores</h2></div></div><div class="importHistory">'+hist+'</div><div class="divider"></div><details class="supplierImport"><summary>Atualizar cadastro de fornecedores</summary><div class="stack"><input id="supplierFile" type="file" accept=".xlsx"><button class="btn ghost" id="impSuppliers">Importar fornecedores</button></div></details><button class="btn ghost" id="cancelM">Fechar</button>');
  document.getElementById('impOrders').onclick=function(){upload('orders',document.getElementById('orderFile'))};
  document.getElementById('impSuppliers').onclick=function(){upload('suppliers',document.getElementById('supplierFile'))};
  document.getElementById('cancelM').onclick=closeModal
}
async function upload(kind,el){
  if(!el||!el.files[0])return toast('Selecione o arquivo');
  var fd=new FormData();fd.append('file',el.files[0]);
  try{
    var r=await fetch('/api/import/'+kind,{method:'POST',credentials:'include',body:fd});
    if(r.status===401){location='/?updated=1';return}
    var j=await r.json();
    if(!r.ok)throw new Error(j.detail||'Falha na importação');
    if(kind==='orders'){
      toast(j.new_orders!==undefined?'Importação concluída: '+j.new_orders+' novos · '+j.skipped_orders+' preservados':'Importação concluída: '+j.created+' novos · '+j.skipped+' preservados')
    }else{
      toast('Fornecedores processados: '+j.rows)
    }
    closeModal();
    await refreshAll()
  }catch(e){toast('Importação: '+e.message)}
}
function openUsers(){
  var buyers=state.users.filter(function(u){return u.role==='buyer'});
  var list=buyers.length?buyers.map(function(u){
    return '<div class="teamRow"><div class="teamAvatar">'+esc((u.name||u.username||'?').charAt(0).toUpperCase())+'</div><div><b>'+esc(u.name)+'</b><small>@'+esc(u.username||'')+'</small></div><span>Comprador</span></div>'
  }).join(''):'<div class="teamEmpty">Nenhum comprador acessou o sistema ainda.</div>';
  openModal('<div class="modalHead"><div><span class="micro">EQUIPE</span><h2>Usuários compradores</h2><p>Os compradores aparecem aqui automaticamente depois do primeiro acesso.</p></div></div><div class="teamList">'+list+'</div><div class="divider"></div><div class="teamHelp">Total de compradores cadastrados: <b>'+buyers.length+'</b></div><button class="btn ghost" id="cancelU">Fechar</button>');
  document.getElementById('cancelU').onclick=closeModal;
}
function openPassword(){
  openModal('<div class="modalHead"><div><span class="micro">SEGURANÇA</span><h2>Alterar senha</h2><p>Use sua senha atual para definir uma nova.</p></div></div><div class="stack"><input id="currentPass" type="password" autocomplete="current-password" placeholder="Senha atual"><input id="newPass" type="password" autocomplete="new-password" placeholder="Nova senha"><input id="confirmPass" type="password" autocomplete="new-password" placeholder="Confirmar nova senha"><button class="btn" id="savePass">Alterar senha</button><button class="btn ghost" id="cancelPass">Cancelar</button></div>');
  document.getElementById('savePass').onclick=changePassword;
  document.getElementById('cancelPass').onclick=closeModal;
  ['currentPass','newPass','confirmPass'].forEach(function(id){document.getElementById(id).addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();changePassword()}})})
}
async function changePassword(){
  var current=document.getElementById('currentPass').value;
  var next=document.getElementById('newPass').value;
  var confirm=document.getElementById('confirmPass').value;
  if(!current||!next||!confirm)return toast('Preencha as três senhas');
  if(next!==confirm)return toast('A confirmação não confere');
  try{
    await req('/api/change-password',{method:'POST',body:JSON.stringify({current_password:current,new_password:next})});
    state.user.must_change_password=false;
    toast('Senha alterada com sucesso');
    closeModal();
  }catch(e){toast(e.message)}
}
function connectEvents(){if(state.events)state.events.close();var es=new EventSource('/api/events');state.events=es;es.onopen=function(){liveText.textContent='tempo real';liveDot.style.background='#22c55e'};es.onmessage=async function(ev){try{var m=JSON.parse(ev.data);if(m.type==='import.completed')toast('Importação '+(m.payload.filename||'')+': '+(m.payload.created||0)+' novos pedidos');else if(m.type==='buyer.submitted')toast('Pedido '+m.payload.number+' preenchido por '+m.payload.buyer);await refreshAll()}catch(e){}};es.onerror=function(){liveText.textContent='verificando versão…';liveDot.style.background='#f59e0b';fetch('/api/bootstrap',{credentials:'include'}).then(function(r){return r.json()}).then(function(b){if(!b.user)location=b.update_required?'/?updated=1':'/'}).catch(function(){})}}
setInterval(function(){if(state.user)refreshAll().catch(function(){})},20000);boot();
